<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>UX AI 스킬셋</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="스킬셋">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #0f1218;
      --surface: #171b24;
      --surface2: #1e2430;
      --border: #2a3142;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #5b8def;
      --accent2: #3d6fd4;
      --success: #3ecf8e;
      --warn: #f0b429;
      --radius: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,.35);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea { font-family: inherit; color: var(--text); }

    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .app-header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .er-badge {
      display: flex; align-items: center; gap: 10px; font-size: 13px;
    }
    .er-pill {
      background: var(--surface2); border: 1px solid var(--border);
      padding: 6px 12px; border-radius: 999px; color: var(--muted);
    }
    .er-pill strong { color: var(--success); }
    .er-pill.done { border-color: var(--success); background: rgba(62, 207, 142, 0.12); }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-sm {
      padding: 6px 12px; border-radius: 8px; font-size: 12px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      background: var(--accent); color: #fff; border: 1px solid var(--accent2);
    }
    .btn-primary:hover { filter: brightness(1.08); }

    .main { display: flex; flex: 1; min-height: 0; height: calc(100vh - 48px); }
    .sidebar {
      width: 300px; min-width: 260px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--surface);
    }
    .tabs {
      display: flex; border-bottom: 1px solid var(--border);
    }
    .tabs button {
      flex: 1; padding: 10px 6px; font-size: 12px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .search-wrap { padding: 10px 12px; }
    .search-wrap input {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); font-size: 13px;
    }
    .search-wrap input:focus { outline: none; border-color: var(--accent); }
    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 10px 80px; }

    .skill-chip {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface2); margin-bottom: 8px; cursor: grab;
      transition: border-color .15s, transform .1s;
    }
    .skill-chip:hover { border-color: var(--muted); }
    .skill-chip.dragging { opacity: 0.5; }
    .skill-chip .star { flex-shrink: 0; padding: 2px; color: var(--muted); font-size: 14px; }
    .skill-chip .star.on { color: var(--warn); }
    .skill-meta { flex: 1; min-width: 0; }
    .skill-meta .slash { font-size: 11px; color: var(--accent); font-family: ui-monospace, monospace; }
    .skill-meta .title { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .skill-meta .desc { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.35; }

    .content {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      padding: 14px; overflow-y: auto; padding-bottom: 120px;
    }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar .role { font-size: 12px; color: var(--muted); margin-left: auto; }
    .projects-grid { display: flex; flex-direction: column; gap: 14px; }

    .project-card {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface2);
      overflow: hidden;
    }
    .project-head {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .project-head h2 { margin: 0; font-size: 14px; flex: 1; }
    .project-head .mini { font-size: 11px; color: var(--muted); }
    .drop-zone {
      min-height: 100px; padding: 10px; display: flex; flex-wrap: wrap; gap: 8px;
      align-content: flex-start; background: rgba(0,0,0,.15);
    }
    .drop-zone.drag-over { outline: 2px dashed var(--accent); outline-offset: -4px; }
    .drop-hint { width: 100%; text-align: center; color: var(--muted); font-size: 12px; padding: 20px; }
    .instance-pill {
      display: inline-flex; align-items: center; gap: 6px; padding: 6px 10px;
      border-radius: 8px; background: var(--bg); border: 1px solid var(--border);
      font-size: 12px; cursor: pointer; max-width: 100%;
    }
    .instance-pill:hover { border-color: var(--accent); }
    .instance-pill .rm { color: var(--muted); padding: 0 2px; cursor: pointer; }
    .instance-pill .rm:hover { color: #f87171; }

    /* Bottom detail panel */
    .detail-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
    }
    .detail-backdrop.open { opacity: 1; pointer-events: auto; }
    .detail-panel {
      position: fixed; left: 0; right: 0; bottom: 0; max-height: 55vh;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
      z-index: 50; display: flex; flex-direction: column;
    }
    .detail-panel.open { transform: translateY(0); }
    .detail-handle {
      width: 40px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 10px auto 6px;
    }
    .detail-head {
      padding: 0 18px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px;
    }
    .detail-head h3 { margin: 0; font-size: 16px; flex: 1; }
    .detail-body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .usage-btn {
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 600;
    }
    .usage-btn:hover { filter: brightness(1.06); }
    .copy-btn {
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      border: 1px solid var(--border); background: var(--surface2);
    }
    .copy-btn:hover { border-color: var(--accent); }
    textarea.prompt-area {
      width: 100%; min-height: 160px; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); font-size: 13px; line-height: 1.5; resize: vertical;
    }
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border); padding: 10px 18px;
      border-radius: 999px; font-size: 13px; z-index: 100; opacity: 0; transition: .25s;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
    }
    .modal h4 { margin: 0 0 12px; font-size: 15px; }
    .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .modal input {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); margin-bottom: 12px;
    }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

    .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>UX AI 스킬셋</h1>
    <div class="er-badge">
      <span class="er-pill" id="erPill">사례 <strong id="usageCount">0</strong>/10건</span>
      <span class="er-pill" id="envBadge" style="max-width:42vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title=""></span>
    </div>
    <div class="header-actions">
      <button type="button" class="btn-sm" id="btnRefreshSkills" style="display:none" title="skills/index.json 에서 기본 스킬 새로고침">↻ 스킬 업데이트</button>
      <button type="button" class="btn-sm" id="btnLogin">세션</button>
      <button type="button" class="btn-primary" id="btnNewProject">+ 프로젝트</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="tabs" id="sidebarTabs">
        <button type="button" data-tab="skills" class="active">스킬</button>
        <button type="button" data-tab="favorites">즐겨찾기</button>
        <button type="button" data-tab="projects">프로젝트</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="sidebarSearch" placeholder="검색…" autocomplete="off" />
      </div>
      <div class="sidebar-scroll" id="sidebarList"></div>
    </aside>

    <section class="content">
      <div class="toolbar">
        <span style="font-size:13px;color:var(--muted)">스킬을 드래그하여 프로젝트 카드에 놓으세요. 동일 스킬을 여러 프로젝트에 둘 수 있습니다. 기획 산출은 복사 시 <strong>마크다운</strong> 공통 규칙이 자동 첨부됩니다.</span>
        <span class="role" id="roleLabel">비로그인 · 조회·복사만</span>
      </div>
      <div class="projects-grid" id="projectsGrid"></div>
    </section>
  </div>

  <div class="detail-backdrop" id="detailBackdrop"></div>
  <div class="detail-panel" id="detailPanel">
    <div class="detail-handle"></div>
    <div class="detail-head">
      <div>
        <div class="slash" id="detailSlash"></div>
        <h3 id="detailTitle"></h3>
      </div>
      <button type="button" class="btn-sm" id="btnCloseDetail">닫기</button>
    </div>
    <div class="detail-body">
      <p style="margin:0 0 8px;font-size:12px;color:var(--muted)" id="detailDesc"></p>
      <p style="margin:0 0 6px;font-size:11px;color:var(--muted)">「프롬프트 복사」 시 아래에 없어도 <strong>마크다운 공통 출력 규칙</strong>이 클립보드에 자동으로 덧붙습니다.</p>
      <textarea class="prompt-area" id="detailPrompt" spellcheck="false"></textarea>
      <div class="detail-actions">
        <button type="button" class="copy-btn" id="btnCopy">프롬프트 복사</button>
        <button type="button" class="usage-btn" id="btnUsage">사용 +0</button>
        <button type="button" class="btn-sm" id="btnEditSkill" style="display:none">스킬 편집</button>
        <button type="button" class="btn-sm" id="btnDelSkill" style="display:none;border-color:#7f1d1d;color:#fca5a5">스킬 삭제</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalSession">
    <div class="modal">
      <h4>세션</h4>
      <p style="font-size:12px;color:var(--muted);margin:0 0 12px">
        비로그인: 조회·복사만. 이름 입력 후 로그인: 스킬 추가·본인 스킬 편집. 관리자 PIN: 전체 편집·삭제.
      </p>
      <label>표시 이름 (일반 사용자)</label>
      <input type="text" id="inputDisplayName" placeholder="예: 김보니" />
      <label>관리자 PIN (선택)</label>
      <input type="password" id="inputAdminPin" placeholder="PIN이 있으면 관리자 권한" autocomplete="off" />
      <div class="row">
        <button type="button" class="btn-sm" id="btnGuest">비로그인으로</button>
        <button type="button" class="btn-primary" id="btnSaveSession">적용</button>
      </div>
    </div>
  </div>

  <div class="modal-backdrop" id="modalSkill">
    <div class="modal">
      <h4 id="skillModalTitle">스킬</h4>
      <label>스킬명</label>
      <input type="text" id="skName" />
      <label>슬래시 명령어 (예: /my-skill)</label>
      <input type="text" id="skSlash" />
      <label>한 줄 설명</label>
      <input type="text" id="skDesc" />
      <label>프롬프트 본문</label>
      <textarea class="prompt-area" id="skPrompt" style="min-height:120px"></textarea>
      <div class="row" style="justify-content:space-between;flex-wrap:wrap;gap:8px">
        <button type="button" class="btn-sm" id="btnSkillDelete" style="display:none;border-color:#7f1d1d;color:#fca5a5">스킬 완전 삭제</button>
        <span style="flex:1"></span>
        <button type="button" class="btn-sm" id="btnSkillCancel">취소</button>
        <button type="button" class="btn-primary" id="btnSkillSave">저장</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>window.__UX_SKILLSET_ENV__ = window.__UX_SKILLSET_ENV__ || {};</script>
  <script src="env-config.js"></script>
  <script>
    const APP_ENV =
      typeof window.__UX_SKILLSET_ENV__ === "object" && window.__UX_SKILLSET_ENV__ !== null
        ? window.__UX_SKILLSET_ENV__
        : {};

    /** 우선순위: .env 경유 ADMIN_PIN → 코드 기본값 (로컬에 env-config.js 없을 때) */
    const ADMIN_PIN =
      (APP_ENV.ADMIN_PIN && String(APP_ENV.ADMIN_PIN).trim()) || "1234";

    const STORAGE_KEY = "ux_skillset_v10";

    /** 복사 시 LLM에 함께 넘기는 공통 지침: 기획 산출물은 마크다운 기본 */
    const MARKDOWN_OUTPUT_BLOCK =
      "\n\n---\n[공통 출력 규칙 — UX AI 스킬셋]\n" +
      "- 본 답변의 **기획·정리 산출물**은 기본적으로 **마크다운(GFM)** 형식으로 작성한다.\n" +
      "- `#`~`###` 제목, 불릿/번호 목록, 표, ` ``` ` 코드펜스(Mermaid 포함)를 적극 활용한다.\n" +
      "- 한 파일로보낼 수 있게 구조화한다.\n";

    function hasMarkdownDirective(text) {
      return typeof text === "string" && text.includes("[공통 출력 규칙 — UX AI 스킬셋]");
    }

    function buildClipboardPrompt(body) {
      const t = body || "";
      if (hasMarkdownDirective(t)) return t;
      return t + MARKDOWN_OUTPUT_BLOCK;
    }

    function maskSecret(v) {
      if (v == null || v === "") return "";
      const s = String(v);
      if (s.length <= 4) return "****";
      return s.slice(0, 2) + "…" + s.slice(-2);
    }

    function renderEnvBadge() {
      const keys = Object.keys(APP_ENV).filter((k) => APP_ENV[k] != null && String(APP_ENV[k]).trim() !== "");
      const el = document.getElementById("envBadge");
      if (!el) return;
      if (!keys.length) {
        el.textContent = "설정: .env 미적용 (node scripts/apply-env.mjs)";
        el.title = "env-config.js 없음 또는 비어 있음. .env.example → .env 후 apply-env 실행.";
        return;
      }
      el.textContent = `설정: ${keys.length}개 키 (${keys.map((k) => k + "=" + maskSecret(APP_ENV[k])).join(", ")})`;
      el.title = "window.__UX_SKILLSET_ENV__ — API Key 등은 레포에 커밋하지 말 것";
    }

    const DEFAULT_SKILLS = [
      { id: "s0", name: "피그마 초안 자동 생성", slash: "/figma-draft", desc: "CaMP 설계킷 기반 화면 초안", authorId: null, usage: 0,
        prompt: `당신은 UX 디자이너입니다. CaMP 설계킷(또는 제공하는 컴포넌트 라이브러리)을 기준으로 아래 요구사항에 맞는 피그마 화면 초안 구조를 제안하세요.\n\n- 화면명 / 목적\n- 섹션별 와이어 수준 레이아웃(텍스트로 영역 설명)\n- 사용할 컴포넌트 후보와 상태(empty, loading, error)\n- 인터랙션 메모\n\n요구사항:\n` },
      { id: "s1", name: "스펙 분석 · 문의 목록", slash: "/spec-analysis", desc: "스펙 파악 + 애매한 항목 추출", authorId: null, usage: 0,
        prompt: `다음 제품/기능 스펙을 읽고 정리하세요.\n\n1) 핵심 사용자 시나리오 요약\n2) 명확히 정의된 요구사항 목록\n3) 애매하거나 누락 가능성이 있는 항목 → PM/개발에 질문할 문의 목록(우선순위 포함)\n4) UX 리스크(인지부하, 오류 가능성 등)\n\n스펙:\n` },
      { id: "s2", name: "벤치마킹 · 인사이트", slash: "/benchmarking", desc: "유사 서비스 사례 수집", authorId: null, usage: 0,
        prompt: `우리가 만들려는 서비스/기능과 유사한 글로벌·국내 사례를 벤치마킹하세요.\n\n- 서비스명, URL(알면), 관련 화면\n- 잘한 점 / 아쉬운 점\n- 우리 제품에 가져올 인사이트 3가지\n\n대상:\n` },
      { id: "s3", name: "As-is / To-be 정리", slash: "/asis-tobe", desc: "설득 자료용 비교표", authorId: null, usage: 0,
        prompt: `현재(As-is)와 개선 후(To-be)를 비교하는 표와 한 페이지 요약 슬라이드용 불릿을 만드세요.\n\n표 열: 영역 | As-is | To-be | 기대효과 | 이해관계자 메시지\n\n맥락:\n` },
      { id: "s4", name: "플로우차트 · 프로세스 맵", slash: "/flowchart", desc: "Mermaid 다이어그램 자동 생성", authorId: null, usage: 0,
        prompt: `아래 프로세스를 Mermaid flowchart 문법으로 표현하세요. 분기·예외·되돌아가기를 포함하고, 코드블록으로만 출력하세요.\n\n프로세스 설명:\n` },
      { id: "s5", name: "기능 정의서 · 엣지케이스", slash: "/feature-spec", desc: "세부 기능 + 예외 처리 정리", authorId: null, usage: 0,
        prompt: `기능 정의서 형식으로 정리하세요.\n\n- 기능 ID, 이름, 목적\n- 입력/출력, 상태 전이\n- 정상 플로우\n- 엣지케이스(네트워크 오류, 권한, 빈 데이터, 중복 등)와 처리 방침\n- 비기능(접근성, 성능) 메모\n\n대상 기능:\n` },
      { id: "s6", name: "휴리스틱 평가 1차 탐지", slash: "/heuristic", desc: "닐슨 10원칙 기반 화면 점검", authorId: null, usage: 0,
        prompt: `닐슨 휴리스틱 10원칙 기준으로 화면을 1차 점검하세요. 각 원칙별로 관찰된 문제, 심각도(낮/중/높), 개선 제안을 표로 정리하세요. 스크린샷이나 화면 설명이 있으면 함께 고려합니다.\n\n화면:\n` },
      { id: "s7", name: "회의록 · 액션아이템", slash: "/meeting-notes", desc: "미팅 후 정리 자동화", authorId: null, usage: 0,
        prompt: `회의 메모/전사본을 아래 형식으로 정리하세요.\n\n- 결정사항\n- 액션아이템(담당, 기한, 완료조건)\n- 열린 이슈 / 다음 논의 안건\n\n원문:\n` },
      { id: "s8", name: "리뷰 코멘트 수정 목록", slash: "/review-comments", desc: "피그마 리뷰 코멘트 우선순위화", authorId: null, usage: 0,
        prompt: `피그마(또는 디자인 리뷰) 코멘트 목록을 우선순위와 수정 난이도로 분류하고, 수정안 초안을 제안하세요. 표: 우선순위 | 코멘트 요약 | 화면/컴포넌트 | 제안 수정안\n\n코멘트:\n` },
    ];

    function uid() {
      return "id_" + Math.random().toString(36).slice(2, 11) + Date.now().toString(36);
    }

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) {
          return {
            skills: DEFAULT_SKILLS.map(s => ({ ...s })),
            projects: [{ id: uid(), name: "샘플 프로젝트", instances: [] }],
            favorites: [],
            session: { mode: "guest", displayName: "", admin: false },
            caseCount: 0,
          };
        }
        const d = JSON.parse(raw);
        if (!d.skills || !d.skills.length) d.skills = DEFAULT_SKILLS.map(s => ({ ...s }));
        if (!d.projects) d.projects = [{ id: uid(), name: "프로젝트 1", instances: [] }];
        if (!Array.isArray(d.favorites)) d.favorites = [];
        if (!d.session) d.session = { mode: "guest", displayName: "", admin: false };
        if (typeof d.caseCount !== "number") d.caseCount = 0;
        d.skills.forEach(s => { if (typeof s.usage !== "number") s.usage = 0; });
        return d;
      } catch {
        return loadState.fallback();
      }
    }
    loadState.fallback = () => ({
      skills: DEFAULT_SKILLS.map(s => ({ ...s })),
      projects: [{ id: uid(), name: "샘플 프로젝트", instances: [] }],
      favorites: [],
      session: { mode: "guest", displayName: "", admin: false },
      caseCount: 0,
    });

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    }

    let state = loadState();
    let sidebarTab = "skills";
    let selectedSkillId = null;
    let editingSkillId = null;
    let dragSkillId = null;

    const $ = (id) => document.getElementById(id);

    function roleLabel() {
      if (state.session.admin) return "관리자 · 전체 편집·삭제";
      if (state.session.mode === "user") return `일반 · ${state.session.displayName || "사용자"}`;
      return "비로그인 · 조회·복사만";
    }

    function canAddEditSkill(skill) {
      if (state.session.admin) return true;
      if (state.session.mode !== "user") return false;
      if (!skill.authorId) return false;
      return skill.authorId === state.session.userId;
    }

    function isAdmin() { return !!state.session.admin; }
    function isUser() { return state.session.mode === "user"; }

    function normalizeSlash(s) {
      s = (s || "").trim();
      if (!s.startsWith("/")) s = "/" + s;
      return s.replace(/\s+/g, "-").toLowerCase();
    }

    function renderER() {
      const n = state.caseCount;
      $("usageCount").textContent = String(n);
      const pill = $("erPill");
      pill.classList.toggle("done", n >= 10);
    }

    function filteredSkills() {
      const q = ($("sidebarSearch").value || "").trim().toLowerCase();
      let list = [...state.skills];
      if (sidebarTab === "favorites") {
        list = list.filter(s => state.favorites.includes(s.id));
      }
      if (q) {
        list = list.filter(s =>
          s.name.toLowerCase().includes(q) ||
          (s.slash || "").toLowerCase().includes(q) ||
          (s.desc || "").toLowerCase().includes(q)
        );
      }
      if (sidebarTab === "skills") {
        list.sort((a, b) => {
          const fa = state.favorites.includes(a.id) ? 1 : 0;
          const fb = state.favorites.includes(b.id) ? 1 : 0;
          if (fb !== fa) return fb - fa;
          return 0;
        });
      }
      return list;
    }

    function renderSidebar() {
      const el = $("sidebarList");
      el.innerHTML = "";
      if (sidebarTab === "projects") {
        state.projects.forEach(p => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "skill-chip";
          row.style.cursor = "pointer";
          row.innerHTML = `<div class="skill-meta"><div class="title">${escapeHtml(p.name)}</div><div class="desc">스킬 ${p.instances.length}개 · 클릭 시 스크롤</div></div>`;
          row.addEventListener("click", () => {
            const card = document.querySelector(`[data-project-id="${CSS.escape(p.id)}"]`);
            card?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          el.appendChild(row);
        });
        if (!state.projects.length) el.innerHTML = `<div class="empty-state">프로젝트가 없습니다.</div>`;
        return;
      }
      const skills = filteredSkills();
      if (!skills.length) {
        el.innerHTML = `<div class="empty-state">해당 없음</div>`;
        return;
      }
      skills.forEach(skill => {
        const chip = document.createElement("div");
        chip.className = "skill-chip";
        chip.draggable = true;
        chip.dataset.skillId = skill.id;
        const fav = state.favorites.includes(skill.id);
        chip.innerHTML = `
          <button type="button" class="star ${fav ? "on" : ""}" data-star title="즐겨찾기">★</button>
          <div class="skill-meta">
            <div class="slash">${escapeHtml(skill.slash)}</div>
            <div class="title">${escapeHtml(skill.name)}</div>
            <div class="desc">${escapeHtml(skill.desc || "")}</div>
          </div>`;
        chip.querySelector(".star").addEventListener("click", (e) => {
          e.stopPropagation();
          toggleFav(skill.id);
        });
        chip.addEventListener("click", (e) => {
          if ((e.target).closest(".star")) return;
          openDetail(skill.id);
        });
        chip.addEventListener("dragstart", (e) => {
          dragSkillId = skill.id;
          chip.classList.add("dragging");
          e.dataTransfer.setData("text/skill-id", skill.id);
          e.dataTransfer.effectAllowed = "copy";
        });
        chip.addEventListener("dragend", () => {
          chip.classList.remove("dragging");
          dragSkillId = null;
        });
        el.appendChild(chip);
      });
      if ((isUser() || isAdmin()) && sidebarTab === "skills") {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "btn-primary";
        add.style.width = "100%";
        add.style.marginTop = "8px";
        add.textContent = "+ 새 스킬 추가";
        add.addEventListener("click", () => openSkillModal(null));
        el.appendChild(add);
      }
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t;
      return d.innerHTML;
    }

    function toggleFav(id) {
      const i = state.favorites.indexOf(id);
      if (i >= 0) state.favorites.splice(i, 1);
      else state.favorites.push(id);
      saveState();
      renderSidebar();
    }

    function renderProjects() {
      const grid = $("projectsGrid");
      grid.innerHTML = "";
      state.projects.forEach(p => {
        const card = document.createElement("div");
        card.className = "project-card";
        card.dataset.projectId = p.id;
        const head = document.createElement("div");
        head.className = "project-head";
        head.innerHTML = `<h2 contenteditable="${isAdmin() || isUser() ? "true" : "false"}" data-rename="${p.id}">${escapeHtml(p.name)}</h2>
          <span class="mini">${p.instances.length}개</span>`;
        if (isAdmin() || isUser()) {
          const del = document.createElement("button");
          del.type = "button";
          del.className = "btn-sm";
          del.textContent = "삭제";
          del.addEventListener("click", () => {
            if (!confirm("프로젝트를 삭제할까요?")) return;
            state.projects = state.projects.filter(x => x.id !== p.id);
            saveState();
            renderProjects();
            renderSidebar();
          });
          head.appendChild(del);
        }
        const h2 = head.querySelector("h2");
        if (h2.isContentEditable) {
          h2.addEventListener("blur", () => {
            const nv = h2.textContent.trim() || p.name;
            p.name = nv;
            h2.textContent = nv;
            saveState();
            renderSidebar();
          });
        }

        const zone = document.createElement("div");
        zone.className = "drop-zone";
        zone.dataset.dropProject = p.id;
        if (!p.instances.length) {
          const hint = document.createElement("div");
          hint.className = "drop-hint";
          hint.textContent = "여기로 스킬을 드래그 앤 드롭";
          zone.appendChild(hint);
        }
        p.instances.forEach(inst => {
          const sk = state.skills.find(s => s.id === inst.skillId);
          if (!sk) return;
          const pill = document.createElement("div");
          pill.className = "instance-pill";
          pill.innerHTML = `<span>${escapeHtml(sk.name)}</span>`;
          pill.addEventListener("click", () => openDetail(sk.id));
          if (isAdmin() || isUser()) {
            const rm = document.createElement("span");
            rm.className = "rm";
            rm.textContent = "×";
            rm.title = "프로젝트에서 제거";
            rm.addEventListener("click", (e) => {
              e.stopPropagation();
              p.instances = p.instances.filter(x => x.instanceId !== inst.instanceId);
              saveState();
              renderProjects();
            });
            pill.appendChild(rm);
          }
          zone.appendChild(pill);
        });

        ["dragenter", "dragover"].forEach(ev => {
          zone.addEventListener(ev, (e) => {
            e.preventDefault();
            zone.classList.add("drag-over");
          });
        });
        zone.addEventListener("dragleave", (e) => {
          if (!zone.contains(e.relatedTarget)) zone.classList.remove("drag-over");
        });
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("drag-over");
          if (!isUser() && !isAdmin()) {
            toast("프로젝트에 배치하려면 세션에서 로그인하세요.");
            return;
          }
          const sid = e.dataTransfer.getData("text/skill-id") || dragSkillId;
          if (!sid) return;
          const proj = state.projects.find(x => x.id === p.id);
          if (!proj) return;
          proj.instances.push({ instanceId: uid(), skillId: sid });
          saveState();
          renderProjects();
        });

        card.appendChild(head);
        card.appendChild(zone);
        grid.appendChild(card);
      });
    }

    function canDeleteSkill(sk) {
      if (state.session.admin) return true;
      if (state.session.mode !== "user" || !sk.authorId) return false;
      return sk.authorId === state.session.userId;
    }

    function openDetail(skillId) {
      const sk = state.skills.find(s => s.id === skillId);
      if (!sk) return;
      $("detailPrompt").removeEventListener("input", onPromptInput);
      selectedSkillId = skillId;
      $("detailSlash").textContent = sk.slash;
      $("detailTitle").textContent = sk.name;
      $("detailDesc").textContent = sk.desc || "";
      $("detailPrompt").value = sk.prompt || "";
      const u = typeof sk.usage === "number" ? sk.usage : 0;
      $("btnUsage").textContent = `사용 +${u}`;
      const canEdit = canEditPrompt(sk);
      $("btnEditSkill").style.display = canEdit ? "inline-block" : "none";
      $("btnDelSkill").style.display = canDeleteSkill(sk) ? "inline-block" : "none";
      $("detailPanel").classList.add("open");
      $("detailBackdrop").classList.add("open");
      $("detailPrompt").readOnly = !canEdit;
      if (canEdit) {
        $("detailPrompt").addEventListener("input", onPromptInput);
      }
    }

    function canEditPrompt(sk) {
      if (state.session.admin) return true;
      if (state.session.mode !== "user") return false;
      if (!sk.authorId) return false;
      return sk.authorId === state.session.userId;
    }

    function onPromptInput() {
      const sk = state.skills.find(s => s.id === selectedSkillId);
      if (sk) sk.prompt = $("detailPrompt").value;
      saveState();
    }

    function closeDetail() {
      $("detailPrompt").removeEventListener("input", onPromptInput);
      $("detailPanel").classList.remove("open");
      $("detailBackdrop").classList.remove("open");
      selectedSkillId = null;
    }

    function openSkillModal(id) {
      editingSkillId = id;
      const sk = id ? state.skills.find(s => s.id === id) : null;
      $("skillModalTitle").textContent = sk ? "스킬 편집" : "새 스킬";
      $("skName").value = sk ? sk.name : "";
      $("skSlash").value = sk ? sk.slash : "/";
      $("skDesc").value = sk ? (sk.desc || "") : "";
      $("skPrompt").value = sk ? (sk.prompt || "") : "";
      const showDel = sk && canDeleteSkill(sk);
      $("btnSkillDelete").style.display = showDel ? "inline-block" : "none";
      $("modalSkill").classList.add("open");
    }

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._tm);
      toast._tm = setTimeout(() => t.classList.remove("show"), 2200);
    }

    function init() {
      $("roleLabel").textContent = roleLabel();
      renderEnvBadge();
      renderER();
      renderSidebar();
      renderProjects();

      document.querySelectorAll("#sidebarTabs button").forEach(btn => {
        btn.addEventListener("click", () => {
          sidebarTab = btn.dataset.tab;
          document.querySelectorAll("#sidebarTabs button").forEach(b => b.classList.toggle("active", b === btn));
          $("sidebarSearch").value = "";
          renderSidebar();
        });
      });
      $("sidebarSearch").addEventListener("input", () => renderSidebar());

      $("btnCloseDetail").addEventListener("click", closeDetail);
      $("detailBackdrop").addEventListener("click", closeDetail);

      $("btnCopy").addEventListener("click", async () => {
        const t = buildClipboardPrompt($("detailPrompt").value);
        try {
          await navigator.clipboard.writeText(t);
          toast("복사됨 (마크다운 공통 규칙 포함)");
        } catch {
          toast("복사 실패 — 브라우저 권한 확인");
        }
      });

      $("btnUsage").addEventListener("click", () => {
        const sk = state.skills.find(s => s.id === selectedSkillId);
        if (!sk) return;
        sk.usage = (typeof sk.usage === "number" ? sk.usage : 0) + 1;
        state.caseCount = (state.caseCount || 0) + 1;
        saveState();
        $("btnUsage").textContent = `사용 +${sk.usage}`;
        renderER();
        toast("사용 기록 반영");
      });

      $("btnNewProject").addEventListener("click", () => {
        if (!isUser() && !isAdmin()) {
          toast("프로젝트 추가는 로그인 또는 관리자만 가능합니다.");
          return;
        }
        const name = prompt("프로젝트 이름", "새 프로젝트");
        if (!name) return;
        state.projects.push({ id: uid(), name: name.trim(), instances: [] });
        saveState();
        renderProjects();
        renderSidebar();
      });

      $("btnLogin").addEventListener("click", () => {
        $("inputDisplayName").value = state.session.displayName || "";
        $("inputAdminPin").value = "";
        $("modalSession").classList.add("open");
      });
      $("btnGuest").addEventListener("click", () => {
        state.session = { mode: "guest", displayName: "", admin: false, userId: null };
        saveState();
        $("modalSession").classList.remove("open");
        $("roleLabel").textContent = roleLabel();
        updateAdminUI();
        renderSidebar();
        renderProjects();
        closeDetail();
      });
      $("btnSaveSession").addEventListener("click", () => {
        const pin = $("inputAdminPin").value;
        const name = $("inputDisplayName").value.trim();
        if (pin && pin === ADMIN_PIN) {
          state.session = { mode: "user", displayName: name || "관리자", admin: true, userId: "admin" };
        } else if (name) {
          const uidUser = state.session.userId || uid();
          state.session = { mode: "user", displayName: name, admin: false, userId: uidUser };
        } else {
          state.session = { mode: "guest", displayName: "", admin: false, userId: null };
        }
        saveState();
        $("modalSession").classList.remove("open");
        $("roleLabel").textContent = roleLabel();
        updateAdminUI();
        renderSidebar();
        renderProjects();
        if (selectedSkillId) openDetail(selectedSkillId);
      });

      $("btnSkillCancel").addEventListener("click", () => $("modalSkill").classList.remove("open"));
      $("btnEditSkill").addEventListener("click", () => {
        if (selectedSkillId) openSkillModal(selectedSkillId);
      });
      $("btnDelSkill").addEventListener("click", () => {
        const sk = state.skills.find(s => s.id === selectedSkillId);
        if (!sk || !canDeleteSkill(sk)) return;
        if (!confirm(`스킬 "${sk.name}"을(를) 삭제할까요?`)) return;
        state.skills = state.skills.filter(s => s.id !== sk.id);
        state.favorites = state.favorites.filter(fid => fid !== sk.id);
        state.projects.forEach(p => {
          p.instances = p.instances.filter(inst => inst.skillId !== sk.id);
        });
        saveState();
        closeDetail();
        renderSidebar();
        renderProjects();
        toast("삭제됨");
      });
      $("btnSkillDelete").addEventListener("click", () => {
        const sk = state.skills.find(s => s.id === editingSkillId);
        if (!sk || !canDeleteSkill(sk)) return;
        if (!confirm(`스킬 "${sk.name}"을(를) 완전 삭제할까요?`)) return;
        state.skills = state.skills.filter(s => s.id !== sk.id);
        state.favorites = state.favorites.filter(fid => fid !== sk.id);
        state.projects.forEach(p => {
          p.instances = p.instances.filter(inst => inst.skillId !== sk.id);
        });
        saveState();
        $("modalSkill").classList.remove("open");
        closeDetail();
        renderSidebar();
        renderProjects();
        toast("삭제됨");
      });
      $("btnSkillSave").addEventListener("click", () => {
        const name = $("skName").value.trim();
        const slash = normalizeSlash($("skSlash").value);
        const desc = $("skDesc").value.trim();
        const prompt = $("skPrompt").value;
        if (!name) return toast("스킬명을 입력하세요");
        if (editingSkillId) {
          const sk = state.skills.find(s => s.id === editingSkillId);
          if (!sk) return;
          if (!state.session.admin && (sk.authorId !== state.session.userId || !sk.authorId)) {
            toast("권한 없음");
            return;
          }
          sk.name = name;
          sk.slash = slash;
          sk.desc = desc;
          sk.prompt = prompt;
        } else {
          if (!isUser() && !isAdmin()) return;
          const newSk = {
            id: uid(),
            name,
            slash,
            desc,
            prompt,
            authorId: state.session.userId,
            usage: 0,
          };
          state.skills.unshift(newSk);
        }
        saveState();
        $("modalSkill").classList.remove("open");
        renderSidebar();
        toast("저장됨");
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeDetail();
          $("modalSession").classList.remove("open");
          $("modalSkill").classList.remove("open");
        }
      });
    }

    init();

    // ── PWA & 스킬 동적 로딩 ─────────────────────────────

    function updateAdminUI() {
      $("btnRefreshSkills").style.display = state.session.admin ? "inline-block" : "none";
    }

    async function tryFetchSkills() {
      try {
        const res = await fetch('./skills/index.json', { cache: 'no-cache' });
        if (!res.ok) return null;
        const data = await res.json();
        if (!Array.isArray(data) || !data.length) return null;
        return data.map(s => ({ usage: 0, ...s }));
      } catch {
        return null;
      }
    }

    $("btnRefreshSkills").addEventListener("click", async () => {
      const fresh = await tryFetchSkills();
      if (!fresh) { toast("skills/index.json 로드 실패 — 로컬 서버로 실행 중인지 확인하세요."); return; }
      const userSkills = state.skills.filter(s => s.authorId);
      const freshIds = new Set(fresh.map(s => s.id));
      const preserved = userSkills.filter(s => !freshIds.has(s.id));
      state.skills = [...fresh, ...preserved];
      saveState();
      renderSidebar();
      toast(`기본 스킬 ${fresh.length}개 업데이트 완료`);
    });

    // 첫 실행(localStorage 없음)이면 서버 스킬 자동 로드
    if (!localStorage.getItem(STORAGE_KEY)) {
      tryFetchSkills().then(fresh => {
        if (!fresh) return;
        state.skills = fresh;
        saveState();
        renderSidebar();
      });
    }

    updateAdminUI();

    // Service Worker 등록 (PWA 오프라인·설치 지원)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
