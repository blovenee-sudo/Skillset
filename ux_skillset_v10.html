    function formatMdForDisplay(mdText) {
      let body = mdText.replace(/^---[\s\S]*?---\s*\n/, "").trim();
      body = body.replace(/---\s*\n<!--[^>]*-->\s*\n/g,
        "\n\n━━━━━━━━━━ 지침 내용 ━━━━━━━━━━\n\n");
      return body;
    }

    function renderMd(text, withMermaid = false) {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
      const fmt = s => s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
                        .replace(/\*([^*]+)\*/g,'<em>$1</em>')
                        .replace(/`([^`]+)`/g,'<code>$1</code>');
      const parts = text.split(/(```[\s\S]*?```)/g);
      let html = parts.map((part, i) => {
        if (i % 2 === 1) {
          const nl = part.indexOf('\n');
          const lang = nl >= 0 ? part.slice(3, nl).trim() : '';
          const body = nl >= 0 ? part.slice(nl + 1, -3) : part.slice(3, -3);
          if (withMermaid && lang === 'mermaid') {
            return `<div class="mermaid-wrap"><pre class="mermaid">${body}</pre></div>`;
          }
          return `<pre><code>${esc(body)}</code></pre>`;
        }
        const lines = part.split('\n');
        const out = [];
        let tRows = [];
        const flushTable = () => {
          if (!tRows.length) return;
          const isSep = r => /^\|\s*[-: |]+\s*\|$/.test(r.trim()) && !/[a-zA-Z가-힣]/.test(r);
          const si = tRows.findIndex(isSep);
          const heads = si > 0 ? tRows.slice(0, si) : tRows.slice(0, 1);
          const body = si >= 0 ? tRows.slice(si + 1) : tRows.slice(1);
          const cells = r => r.split('|').slice(1, -1).map(c => c.trim());
          let t = '<table>';
          if (heads.length) t += '<thead><tr>' + cells(heads[0]).map(c => `<th>${fmt(esc(c))}</th>`).join('') + '</tr></thead>';
          if (body.length) t += '<tbody>' + body.map(r => '<tr>' + cells(r).map(c => `<td>${fmt(esc(c))}</td>`).join('') + '</tr>').join('') + '</tbody>';
          t += '</table>';
          out.push(t); tRows = [];
        };
        for (const line of lines) {
          if (/^\|.+\|/.test(line)) { tRows.push(line); continue; }
          flushTable();
          if (/^### /.test(line)) out.push(`<h3>${fmt(esc(line.slice(4)))}</h3>`);
          else if (/^## /.test(line))  out.push(`<h2>${fmt(esc(line.slice(3)))}</h2>`);
          else if (/^# /.test(line))   out.push(`<h1>${fmt(esc(line.slice(2)))}</h1>`);
          else if (/^[-*] /.test(line)) out.push(`<li>${fmt(esc(line.slice(2)))}</li>`);
          else if (/^\d+\. /.test(line)) out.push(`<li>${fmt(esc(line.replace(/^\d+\. /,'')))}</li>`);
          else if (/^---+$/.test(line) || /^━+$/.test(line)) out.push('<hr>');
          else if (line.trim() === '') out.push('<br>');
          else out.push(fmt(esc(line)));
        }
        flushTable();
        return out.join('\n');
      }).join('');
      return html;
    }

    function loadMermaidAndRender(container) {
      const nodes = [...container.querySelectorAll('.mermaid')];
      if (!nodes.length) return;
      const run = () => {
        const isDark = !document.documentElement.classList.contains('theme-light');
        mermaid.initialize({ startOnLoad: false, theme: isDark ? 'dark' : 'default', securityLevel: 'loose' });
        mermaid.run({ nodes });
      };
      if (window.mermaid) { run(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
      s.onload = run;
      document.head.appendChild(s);
    }

    function updateCopyBtn() {
      const sk = selectedSkillId ? state.skills.find(s => s.id === selectedSkillId) : null;
      if (!sk) return;
      const llmType = state.llmType || 'other';
      const isRegistered = !!(state.registeredSkills || {})[sk.id];
      if (llmType === 'claude') {
        $("btnCopy").textContent = isRegistered ? "스킬 복사" : "스킬 등록";
      } else {
        $("btnCopy").textContent = "스킬 복사";
      }
    }

    function openDetail(skillId, projectId = null) {
      try {
      const sk = state.skills.find(s => s.id === skillId);
      if (!sk) return;
      selectedSkillId = skillId;
      selectedProjectId = projectId;
      $("copyHint").style.display = "none";
      $("detailSlash").textContent = sk.slash;
      $("detailSlashBadge").textContent = sk.slash || sk.name;
      $("detailTitle").textContent = sk.name;
      $("detailAuthor").textContent = sk.authorName ? `작성자: ${sk.authorName}` : "";
      $("detailPrompt").innerHTML = renderMd((sk.authorId !== null && sk.guide)
        ? sk.guide + "\n\n━━━━━━━━━━ 지침 내용 ━━━━━━━━━━\n\n" + (sk.prompt || "")
        : (sk.prompt || ""));

      // 편집: 로그인 사용자 모두 가능 (기본 스킬 포함 — 본인 세션에만 저장됨)
      // 삭제: 기본 스킬은 관리자만 / 사용자 스킬은 본인만
      const canEdit = isLoggedIn();
      const canDelete = isLoggedIn() && (sk.authorId === null ? isAdmin() : sk.authorId === state.session.userId);
      $("btnEditSkill").style.display = canEdit ? "inline-block" : "none";
      $("btnDelSkill").style.display = canDelete ? "inline-block" : "none";


      // 기본 스킬 전용 버튼 (상호 배타적)
      // - 업데이트 적용: 관리자 워크스페이스(또는 index.json) 기준으로 변경이 있을 때
      // - 초기화: 일반 사용자가 직접 수정한 기본 스킬에서만 (관리자는 btnRefreshSkills 사용)
      const isBaseSkill = sk.authorId === null;
      const baseRef = isBaseSkill ? getEffectiveBaseSkills().find(b => b.id === sk.id) : null;
      const hasUpstreamUpdate = !!baseRef &&
        ["name","slash","desc","prompt"].some(f => sk[f] !== baseRef[f]);
      const userEdited = !!sk._editedFromBase;
      // 업데이트 적용: 일반 사용자에게만, upstream 변경 있으면 표시
      // 초기화: 일반 사용자가 편집한 경우에만 (관리자는 해당 없음)
      $("detailUpdateBadge").style.display =
        (isLoggedIn() && !isAdmin() && isBaseSkill && hasUpstreamUpdate) ? "inline-block" : "none";
      $("btnResetSkill").style.display =
        (isLoggedIn() && !isAdmin() && isBaseSkill && userEdited && !hasUpstreamUpdate) ? "inline-block" : "none";

      // 기본 스킬: latestBaseSkills 최신 prompt 즉시 표시 (enrichBaseSkillsFromMd 완료 상태)
      if (isBaseSkill && baseRef && baseRef.prompt) {
        $("detailPrompt").innerHTML = renderMd(formatMdForDisplay(baseRef.prompt));
      }

      // 네트워크에서 최신 MD fetch → 위 표시 위에 덮어쓰기 (앱 장시간 실행 시 갱신 대비)
      if (isBaseSkill) {
        const slash = (baseRef || sk).slash;
        fetch(`./skills/${sk.id}-${slash.slice(1)}.md`, { cache: 'no-cache' })
          .then(res => res.ok ? res.text() : null)
          .then(md => {
            if (!md || selectedSkillId !== skillId) return;
            if (/^\s*<!DOCTYPE html/i.test(md) || /^\s*<html/i.test(md)) return;
            $("detailPrompt").innerHTML = renderMd(formatMdForDisplay(md));
          })
          .catch(() => {});
      }

      $("llmTypeSelect").value = state.llmType || 'other';
      updateCopyBtn();
      $("detailPanel").classList.add("open");
      $("detailBackdrop").classList.add("open");
      } catch (e) {
        console.error("openDetail error:", e);
        toast("스킬 패널 오류: " + e.message);
      }
    }

    function closeDetail() {
      $("detailPanel").classList.remove("open");
      $("detailBackdrop").classList.remove("open");
      selectedSkillId = null;
      selectedProjectId = null;
    }


    function openSkillModal(id) {
      editingSkillId = id;
      const sk = id ? state.skills.find(s => s.id === id) : null;
      $("skillModalTitle").textContent = sk ? "스킬 편집" : "새 스킬";
      $("skName").value = sk ? sk.name : "";
      $("skSlash").value = sk ? sk.slash : "/";
      $("skDesc").value = sk ? (sk.desc || "") : "";
      $("skGuide").value = sk ? (sk.guide || "") : "";
      $("skPrompt").value = sk ? (sk.prompt || "") : "";
      $("btnSkillDelete").style.display = sk ? "inline-block" : "none";
      $("modalSkill").classList.add("open");
    }

    function openManage() {
      $("manageCaseCount").textContent = `${state.caseCount}건`;
      const isLight = document.documentElement.classList.contains("theme-light");
      $("btnToggleTheme").textContent = isLight ? "다크" : "라이트";
      $("modalManage").classList.add("open");
    }

    function toast(msg) {
      const t = $("toast");
      t.textContent = msg;
      t.classList.add("show");
      clearTimeout(toast._tm);
      toast._tm = setTimeout(() => t.classList.remove("show"), 2500);
    }

    function updateLoginBtn() {
      const btn = $("btnLogin");
      if (isLoggedIn()) {
        btn.textContent = state.session.displayName || "나";
        btn.title = "로그인 설정 변경";
      } else {
        btn.textContent = "로그인";
        btn.title = "";
      }
    }

    function init() {
      $("roleLabel").textContent = roleLabelText();
      updateLoginBtn();
      // 저장된 탭 상태 복원
      document.querySelectorAll("#sidebarTabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === sidebarTab);
      });
      renderSidebar();
      renderProjects();

      // ── Sidebar tabs ──
      document.querySelectorAll("#sidebarTabs button").forEach(btn => {
        btn.addEventListener("click", () => {
          sidebarTab = btn.dataset.tab;
          document.querySelectorAll("#sidebarTabs button").forEach(b => b.classList.toggle("active", b === btn));
          $("sidebarSearch").value = "";
          renderSidebar();
        });
      });
      $("sidebarSearch").addEventListener("input", () => renderSidebar());

      // ── Detail panel ──
      $("btnCloseDetail").addEventListener("click", closeDetail);
      $("detailBackdrop").addEventListener("click", closeDetail);


      $("btnCopy").addEventListener("click", async () => {
        const sk = selectedSkillId ? state.skills.find(s => s.id === selectedSkillId) : null;
        if (!sk) return;

        // 기본 스킬은 MD 파일에서 전체 지침 로드 (index.json prompt보다 우선)
        let promptText = sk.prompt || "";
        if (sk.authorId === null) {
          const baseRef = latestBaseSkills && latestBaseSkills.find(b => b.id === sk.id);
          const slash = (baseRef || sk).slash;
          try {
            const res = await fetch(`./skills/${sk.id}-${slash.slice(1)}.md`, { cache: 'no-cache' });
            if (res.ok) {
              const md = await res.text();
              if (/^\s*<!DOCTYPE html/i.test(md) || /^\s*<html/i.test(md)) throw new Error("html-response");
              const noFm = md.replace(/^---[\s\S]*?---\s*\n/, "");
              const aiIdx = noFm.indexOf("<!-- AI INSTRUCTIONS -->");
              const body = (aiIdx >= 0 ? noFm.slice(aiIdx + "<!-- AI INSTRUCTIONS -->".length) : noFm).trim();
              if (body) promptText = body;
            }
          } catch {}
        }

        const injection = buildInjection(selectedProjectId, sk.id);
        const llmType = state.llmType || 'other';
        const isRegistered = !!(state.registeredSkills || {})[sk.id];

        let copyText;
        if (llmType === 'claude' && isRegistered) {
          // 등록된 Claude/Codex: 명령어 + 이전 페이즈 결과만 복사
          copyText = (sk.slash || sk.name) + injection;
        } else if (llmType === 'claude' && !isRegistered) {
          // 미등록 Claude/Codex: 등록 가이드 + 전체 지침 복사 (injection 제외)
          const guide = `━━ 스킬 등록 안내 (최초 1회) ━━\n아래 내용을 Claude Projects 지침 또는 Custom Instructions에 추가하세요.\n등록 후에는 ${sk.slash || sk.name} 명령어만 입력하면 이 지침이 실행됩니다.\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n`;
          copyText = guide + (sk.slash || sk.name) + "\n\n" + promptText;
        } else {
          // 기타 LLM: 기존 동작 (전체 지침 + 이전 페이즈 결과)
          copyText = buildClipboardPrompt((sk.slash || sk.name) + "\n\n" + promptText + injection);
        }

        const ok = await copyToClipboard(copyText);
        if (ok) {
          sk.usage = (sk.usage || 0) + 1;
          state.caseCount = (state.caseCount || 0) + 1;
          saveState();
          renderSidebar();
          toast("스킬 복사됨 ✓");
          const _phaseKey = { s1:'phase1', p2:'phase2', p3:'phase3' }[sk.id];
          const _pid = selectedProjectId;

          if (llmType === 'claude' && !isRegistered) {
            // 첫 복사: 자동으로 등록 완료 처리
            if (!state.registeredSkills) state.registeredSkills = {};
            state.registeredSkills[sk.id] = true;
            saveState();
            updateCopyBtn();
            $("copyHintText").innerHTML = `📋 <strong style="color:var(--text)">스킬 지침이 복사됐습니다.</strong><br>Claude Projects 지침 또는 Custom Instructions에 붙여넣으면 스킬이 등록됩니다.<br>다음 복사부터는 명령어만 복사됩니다.`;
            $("copyHint").style.display = "block";
          } else if (_pid && _phaseKey) {
            // 페이즈 스킬: 패널 닫고 산출물 저장 팝업 자동 열기
            pendingAction = { type: 'deliverable', projectId: _pid, phaseKey: _phaseKey };
            closeDetail();
            openDelivEdit(_pid, _phaseKey);
          } else if (_pid && sk.id === 'qa') {
            // QA 스킬: 패널 닫고 QA 저장 팝업 자동 열기
            const qaPhaseKey = pendingAction?.phaseKey;
            pendingAction = null;
            closeDetail();
            openDelivEdit(_pid, (qaPhaseKey || 'phase1') + '_qa');
          } else {
            const slashCode = `<code style="font-size:11px;color:var(--accent);background:var(--bg);padding:1px 5px;border-radius:3px">${escapeHtml(sk.slash || sk.name)}</code>`;
            if (llmType === 'claude') {
              $("copyHintText").innerHTML = `✓ ${slashCode} 명령어가 복사됐습니다.`;
            } else {
              $("copyHintText").innerHTML = `💡 <strong style="color:var(--text)">Claude Code · Cursor · Copilot</strong> 사용자는 ${slashCode} 명령어만 입력해도 이 지침이 즉시 실행됩니다.`;
            }
            $("copyHint").style.display = "block";
          }
        } else {
          toast("복사 실패 — 브라우저 권한을 확인하세요");
        }
      });

      $("llmTypeSelect").addEventListener("change", () => {
        state.llmType = $("llmTypeSelect").value;
        saveState();
        $("copyHint").style.display = "none";
        updateCopyBtn();
      });



      $("btnEditSkill").addEventListener("click", () => {
        if (!selectedSkillId || !isLoggedIn()) return;
        openSkillModal(selectedSkillId);
      });

      // 공통 헬퍼 — 선택된 스킬을 관리자 워크스페이스(또는 index.json) 내용으로 덮어씀
      function applyBaseToSelected(confirmMsg, doneMsg) {
        if (!isLoggedIn() || !selectedSkillId) return;
        const sk = state.skills.find(s => s.id === selectedSkillId);
        if (!sk) return;
        const base = getEffectiveBaseSkills().find(b => b.id === sk.id);
        if (!base) { toast("기본 스킬 데이터를 불러올 수 없습니다"); return; }
        if (!confirm(confirmMsg)) return;
        ["name","slash","desc","prompt"].forEach(f => { sk[f] = base[f]; });
        sk._editedFromBase = false;
        saveState(); renderSidebar();
        openDetail(selectedSkillId);
        toast(doneMsg);
      }

      $("detailUpdateBadge").addEventListener("click", () => {
        const sk = state.skills.find(s => s.id === selectedSkillId);
        applyBaseToSelected(
          `[${sk && sk.name}] 스킬에 업데이트가 있습니다.\n업데이트 내용으로 덮어씌우겠습니까?`,
          "업데이트가 적용됐습니다"
        );
      });
      $("btnResetSkill").addEventListener("click", () => {
        const sk = state.skills.find(s => s.id === selectedSkillId);
        applyBaseToSelected(
          `[${sk && sk.name}] 스킬을 기본값으로 초기화합니다.\n수정한 내용이 모두 사라집니다. 계속할까요?`,
          "기본값으로 초기화됐습니다"
        );
      });


      $("btnDelSkill").addEventListener("click", () => {
        if (!isLoggedIn()) return;
        const sk = state.skills.find(s => s.id === selectedSkillId);
        if (!sk) return;
        if (sk.authorId === null && !isAdmin()) return; // 기본 스킬은 관리자만 삭제
        if (!confirm(`스킬 "${sk.name}"을(를) 삭제할까요?`)) return;
        if (sk.authorId !== null && FS_SUPPORTED && rootHandle) deleteSkillMdFromFs(sk).catch(() => {});
        state.skills = state.skills.filter(s => s.id !== sk.id);
        state.favorites = state.favorites.filter(fid => fid !== sk.id);
        state.projects.forEach(p => { p.instances = p.instances.filter(i => i.skillId !== sk.id); });
        saveState(); closeDetail(); renderSidebar(); renderProjects(); toast("삭제됨");
      });

      // ── New project ──
      $("btnNewProject").addEventListener("click", () => {
        const name = prompt("프로젝트 이름", "새 프로젝트");
        if (!name) return;
        const defaultInstances = ['s1', 'p2', 'p3']
          .filter(id => state.skills.find(s => s.id === id))
          .map(id => ({ instanceId: uid(), skillId: id, isDefault: true }));
        state.projects.push({ id: uid(), name: name.trim(), instances: defaultInstances });
        saveState(); renderProjects(); renderSidebar();
      });

      // ── Login modal ──
      $("btnLogin").addEventListener("click", async () => {
        $("inputDisplayName").value = state.session.displayName || "";
        $("inputAdminPin").value = "";
        $("adminPinSection").style.display = "none";
        $("nameSection").style.display = "block";
        $("inputWorkspace").value = state.session.workspace || state.session.displayName || "";
        $("inputWorkspace")._manual = !!state.session.workspace;
        // 기존 워크스페이스 칩 표시
        const chips = $("wsChips");
        chips.innerHTML = "";
        const wsList = await listWorkspaces();
        if (wsList.length) {
          wsList.forEach(ws => {
            const btn = document.createElement("button");
            btn.type = "button"; btn.className = "btn-sm";
            btn.textContent = ws;
            btn.style.cssText = "font-size:11px;padding:3px 8px";
            btn.addEventListener("click", () => {
              $("inputDisplayName").value = ws;
              $("inputWorkspace").value = ws;
              $("inputWorkspace")._manual = true;
            });
            chips.appendChild(btn);
          });
          chips.style.display = "flex";
        } else {
          chips.style.display = "none";
        }
        $("btnLogout").style.display = isLoggedIn() ? "inline-block" : "none";
        $("modalSession").classList.add("open");
      });
      // 이름 입력 시 폴더명 자동동기화
      $("inputDisplayName").addEventListener("input", () => {
        if (!$("inputWorkspace")._manual) $("inputWorkspace").value = $("inputDisplayName").value.trim();
      });
      $("inputWorkspace").addEventListener("input", () => { $("inputWorkspace")._manual = true; });
      $("btnToggleAdmin").addEventListener("click", () => {
        const pinSec = $("adminPinSection");
        const isAdminMode = pinSec.style.display !== "none";
        // 관리자 모드 ↔ 일반 모드 전환
        pinSec.style.display = isAdminMode ? "none" : "block";
        $("nameSection").style.display = isAdminMode ? "block" : "none";
        $("inputAdminPin").value = "";
        if (!isAdminMode) $("inputAdminPin").focus();
      });
      $("btnCancelSession").addEventListener("click", () => $("modalSession").classList.remove("open"));
      $("btnLogout").addEventListener("click", () => {
        // 워크스페이스 데이터 저장 후 기본 상태로 복귀
        saveState();
        const base = parseStored(STORAGE_KEY) || defaultState();
        base.session = { mode: "guest", displayName: "", admin: false, userId: null, workspace: null };
        // 비로그인 화면은 관리자 워크스페이스 기준 기본 스킬로 표시
        const effLogout = getEffectiveBaseSkills();
        if (effLogout.length) base.skills = effLogout;
        else if (latestBaseSkills) base.skills = latestBaseSkills;
        state = base;
        applyWorkspaceState();
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        $("modalSession").classList.remove("open");
        $("roleLabel").textContent = roleLabelText();
        updateLoginBtn();
        updateAdminUI();
        renderSidebar();
        renderProjects();
        closeDetail();
        toast("로그아웃됨");
      });
      $("btnSaveSession").addEventListener("click", async () => {
        const isAdminMode = $("adminPinSection").style.display !== "none";
        const pin  = $("inputAdminPin").value;
        const name = $("inputDisplayName").value.trim();

        let workspace, newState, msg;

        if (isAdminMode) {
          // ── 관리자 로그인 ──
          if (!pin) { toast("PIN을 입력해주세요"); $("inputAdminPin").focus(); return; }
          if (pin !== ADMIN_PIN) { toast("PIN이 올바르지 않습니다"); $("inputAdminPin").value = ""; $("inputAdminPin").focus(); return; }
          workspace = "admin";
          const wsDataA = (await loadFromFs(workspace)) || parseStored(wsKey(workspace));
          newState = wsDataA ? normalizeData(wsDataA) : defaultState();
          // 첫 로그인이면 최신 기본 스킬로 세팅 (관리자 첫 로그인은 index.json 기준)
          if (!wsDataA && latestBaseSkills) newState.skills = latestBaseSkills.map(s => ({ ...s }));
          newState.session = { mode: "user", displayName: "관리자", admin: true, userId: "admin", workspace };
          msg = "관리자 로그인";
        } else {
          // ── 일반 사용자 로그인 ──
          if (!name) { toast("이름을 입력해주세요"); $("inputDisplayName").focus(); return; }
          workspace = $("inputWorkspace").value.trim() || name;
          const wsDataB = (await loadFromFs(workspace)) || parseStored(wsKey(workspace));
          newState = wsDataB ? normalizeData(wsDataB) : defaultState();
          // 첫 로그인이면 관리자 워크스페이스 기준 최신 기본 스킬로 세팅 (없으면 index.json)
          if (!wsDataB) {
            const eff = getEffectiveBaseSkills();
            if (eff.length) newState.skills = eff.map(s => ({ ...s }));
            else if (latestBaseSkills) newState.skills = latestBaseSkills.map(s => ({ ...s }));
          }
          const uidUser = (wsDataB && wsDataB.session && wsDataB.session.userId) || state.session.userId || uid();
          newState.session = { mode: "user", displayName: name, admin: false, userId: uidUser, workspace };
          msg = `${name}님 로그인`;
        }
        state = newState;
        applyWorkspaceState();
        saveState();
        $("modalSession").classList.remove("open");
        $("roleLabel").textContent = roleLabelText();
        updateLoginBtn();
        updateAdminUI();
        renderSidebar();
        renderProjects();
        closeDetail();
        toast(msg);
        // 세션 전환 후 기본 스킬 업데이트 감지 (관리자 워크스페이스 기준)
        const effAfterLogin = getEffectiveBaseSkills();
        if (effAfterLogin.length) checkBaseSkillUpdates(effAfterLogin);
      });

      // ── Skill modal ──
      $("btnSkillCancel").addEventListener("click", () => $("modalSkill").classList.remove("open"));
      $("btnSkillDelete").addEventListener("click", () => {
        if (!isLoggedIn()) return;
        const sk = state.skills.find(s => s.id === editingSkillId);
        if (!sk || !confirm(`스킬 "${sk.name}"을(를) 완전 삭제할까요?`)) return;
        if (sk.authorId !== null && FS_SUPPORTED && rootHandle) deleteSkillMdFromFs(sk).catch(() => {});
        state.skills = state.skills.filter(s => s.id !== sk.id);
        state.favorites = state.favorites.filter(fid => fid !== sk.id);
        state.projects.forEach(p => { p.instances = p.instances.filter(i => i.skillId !== sk.id); });
        saveState();
        $("modalSkill").classList.remove("open");
        closeDetail(); renderSidebar(); renderProjects(); toast("삭제됨");
      });
      $("btnSkillSave").addEventListener("click", () => {
        if (!isLoggedIn()) { toast("로그인 후 스킬을 저장할 수 있습니다"); return; }
        const name = $("skName").value.trim();
        const slash = normalizeSlash($("skSlash").value);
        const desc = $("skDesc").value.trim();
        const guide = $("skGuide").value.trim();
        const prompt = $("skPrompt").value;
        if (!name) return toast("스킬명을 입력하세요");
        const isNew = !editingSkillId;
        let llmLines = [];
        if (editingSkillId) {
          const sk = state.skills.find(s => s.id === editingSkillId);
          if (!sk) return;
          // 변경 전 값 캡처 (팝업용)
          const prev = { name: sk.name, slash: sk.slash, desc: sk.desc, prompt: sk.prompt };
          sk.name = name; sk.slash = slash; sk.desc = desc; sk.guide = guide;
          sk.prompt = prompt;
          if (sk.authorId === null) sk._editedFromBase = true; // 기본 스킬 편집 표시
          // 사용자 스킬이면 MD 파일도 업데이트
          if (sk.authorId !== null && FS_SUPPORTED && rootHandle) saveSkillMdToFs(sk).catch(() => {});
          // 관리자가 기본 스킬 편집: latestBaseSkills 인메모리 즉시 반영 + FS 연결 시 MD 파일 저장
          if (sk.authorId === null && isAdmin()) {
            const ref = latestBaseSkills && latestBaseSkills.find(b => b.id === sk.id);
            if (ref) { ref.name = name; ref.slash = slash; ref.desc = desc; ref.guide = guide; ref.prompt = prompt; }
            if (FS_SUPPORTED && rootHandle) saveBaseSkillMdToFs(sk).catch(() => {});
          }
          // 편집 LLM 팝업 내용 구성
          llmLines.push(`아래 내용으로 슬래시 명령어 스킬을 수정해주세요.`);
          llmLines.push(``);
          if (prev.slash !== slash) llmLines.push(`슬래시 명령어: ${prev.slash || "(없음)"} → ${slash}`);
          else if (slash)           llmLines.push(`슬래시 명령어: ${slash}`);
          if (prev.name !== name)   llmLines.push(`스킬명: ${prev.name} → ${name}`);
          else if (name)            llmLines.push(`스킬명: ${name}`);
          if (prev.desc !== desc)   llmLines.push(`설명: ${prev.desc || "(없음)"} → ${desc}`);
          else if (desc)            llmLines.push(`설명: ${desc}`);
          llmLines.push(``);
          llmLines.push(`수정된 지침:`);
          llmLines.push(prompt || "(지침 내용 없음)");
        } else {
          const newSkill = {
            id: uid(), name, slash, desc, guide, prompt,
            authorId: isAdmin() ? null : (state.session.userId || null),
            authorName: isAdmin() ? "" : (state.session.displayName || ""),
            usage: 0,
          };
          state.skills.unshift(newSkill);
          // FS 연결된 경우 사용자 스킬 MD 파일 저장
          if (FS_SUPPORTED && rootHandle) saveSkillMdToFs(newSkill).catch(() => {});
          // 신규 LLM 팝업 내용 구성
          llmLines.push(`아래 내용으로 슬래시 명령어 스킬을 생성해주세요.`);
          llmLines.push(``);
          if (slash) llmLines.push(`슬래시 명령어: ${slash}`);
          if (name)  llmLines.push(`스킬명: ${name}`);
          if (desc)  llmLines.push(`설명: ${desc}`);
          llmLines.push(``);
          llmLines.push(`지침:`);
          llmLines.push(prompt || "(지침 내용 없음)");
        }
        saveState();
        $("modalSkill").classList.remove("open");
        renderSidebar(); toast("저장됨");
        $("llmPromptTitle").textContent = isNew ? "LLM에서 스킬 생성하기" : "LLM에서 스킬 수정하기";
        $("llmPromptDesc").textContent  = isNew
          ? "아래 내용을 복사해 Claude, ChatGPT 등에 붙여넣으면 스킬로 활용할 수 있습니다."
          : "아래 내용을 복사해 Claude, ChatGPT 등에 붙여넣으면 스킬 내용을 수정할 수 있습니다.";
        $("llmPromptText").value = llmLines.join("\n");
        $("modalLLMPrompt").classList.add("open");
      });

      // ── Manage modal ──
      $("btnManage").addEventListener("click", openManage);
      $("btnCloseManage").addEventListener("click", () => $("modalManage").classList.remove("open"));
      $("btnToggleTheme").addEventListener("click", () => {
        const isLight = document.documentElement.classList.toggle("theme-light");
        localStorage.setItem("ax_theme", isLight ? "light" : "dark");
        $("btnToggleTheme").textContent = isLight ? "다크" : "라이트";
      });
      if (localStorage.getItem("ax_theme") === "light") document.documentElement.classList.add("theme-light");
      $("btnResetUsage").addEventListener("click", () => {
        if (!confirm("사용 건수를 초기화할까요?")) return;
        state.caseCount = 0;
        state.skills.forEach(s => s.usage = 0);
        saveState();
        $("manageCaseCount").textContent = "0건";
        renderSidebar();
        toast("사용 건수 초기화됨");
      });
      $("btnClearAll").addEventListener("click", async () => {
        if (!confirm("모든 데이터를 삭제하고 초기 상태로 돌아갑니다. 계속할까요?")) return;
        // localStorage — 모든 워크스페이스 키 + 기본 키 제거
        const prefix = `${STORAGE_KEY}_ws_`;
        const toRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (k && (k === STORAGE_KEY || k.startsWith(prefix))) toRemove.push(k);
        }
        toRemove.forEach(k => localStorage.removeItem(k));
        // File system — session/ 폴더 전체 삭제 (모든 세션 JSON 일괄 제거)
        if (rootHandle) {
          try { await rootHandle.removeEntry("session", { recursive: true }); } catch {}
          sessionHandle = null;
        }
        location.reload();
      });

      // ── Escape to close ──
      // ── LLM prompt modal ──
      $("btnLLMPromptClose").addEventListener("click", () => $("modalLLMPrompt").classList.remove("open"));
      $("btnLLMPromptCopy").addEventListener("click", async () => {
        const ok = await copyToClipboard($("llmPromptText").value);
        toast(ok ? "복사됐습니다. LLM에 붙여넣으세요!" : "복사 실패");
      });

      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          closeDetail();
          $("modalSession").classList.remove("open");
          $("modalSkill").classList.remove("open");
          $("modalManage").classList.remove("open");
          $("modalLLMPrompt").classList.remove("open");
          $("modalDelivEdit").classList.remove("open");
          $("modalDelivView").classList.remove("open");
        }
      });


    }

    init();
    initFsHandle(); // 저장된 폴더 핸들 복원 (권한 있는 경우)

    // ── PWA & 스킬 동적 로딩 ──────────────────────────────

    function updateAdminUI() {
      $("btnRefreshSkills").style.display = isAdmin() ? "inline-block" : "none";
    }

    let latestBaseSkills = null; // skills/index.json 의 최신 기본 스킬 (비교·초기화 용)

    // 기본 스킬 참조: GitHub MD 파일이 소스 오브 트루스
    // enrichBaseSkillsFromMd()가 latestBaseSkills.prompt를 MD 내용으로 채운 후 호출됨
    function getEffectiveBaseSkills() {
      return latestBaseSkills || [];
    }

    async function tryFetchSkills() {
      try {
        const res = await fetch('./skills/index.json', { cache: 'no-cache' });
        if (!res.ok) return null;
        const data = await res.json();
        if (!Array.isArray(data) || !data.length) return null;
        const skills = data.map(s => ({ usage: 0, authorName: "", ...s }));
        latestBaseSkills = skills; // 항상 최신 보관
        return skills;
      } catch { return null; }
    }

    // 각 기본 스킬의 MD 파일을 fetch해 latestBaseSkills.prompt를 실제 파일 내용으로 보강
    // GitHub MD 파일이 소스 오브 트루스 — index.json prompt 필드보다 우선
    async function enrichBaseSkillsFromMd(skills) {
      if (!skills || !skills.length) return;
      await Promise.all(skills.map(async sk => {
        if (sk.authorId !== null) return;
        try {
          const res = await fetch(`./skills/${sk.id}-${sk.slash.slice(1)}.md`, { cache: 'no-cache' });
          if (!res.ok) return;
          const md = await res.text();
          if (/^\s*<!DOCTYPE html/i.test(md) || /^\s*<html/i.test(md)) return;
          const body = md.replace(/^---[\s\S]*?---\s*\n/, "").trim();
          if (body) sk.prompt = body;
        } catch {}
      }));
    }

    // 기본 스킬 업데이트 확인 — 감지 및 알림만, 실제 적용은 스킬 상세 버튼으로
    function checkBaseSkillUpdates(fresh) {
      if (!fresh || !fresh.length) return;
      const FIELDS = ["name", "slash", "desc", "prompt"];
      const count = state.skills.filter(sk => {
        if (sk.authorId !== null || sk._editedFromBase) return false;
        const base = fresh.find(b => b.id === sk.id);
        return base && FIELDS.some(f => sk[f] !== base[f]);
      }).length;
      if (count) toast(`기본 스킬 ${count}개에 업데이트가 있습니다 — 스킬 상세에서 확인·적용`);
    }

    $("btnRefreshSkills").addEventListener("click", async () => {
      const fresh = await tryFetchSkills();
      if (!fresh) { toast("skills/index.json 로드 실패 — 로컬 서버 확인"); return; }
      await enrichBaseSkillsFromMd(latestBaseSkills);
      const base = latestBaseSkills || fresh;
      const userSkills = state.skills.filter(s => s.authorId);
      const baseIds = new Set(base.map(s => s.id));
      const preserved = userSkills.filter(s => !baseIds.has(s.id));
      state.skills = [...base, ...preserved];
      saveState(); renderSidebar();
      toast(`기본 스킬 ${base.length}개 업데이트 완료`);
    });

    tryFetchSkills().then(async fresh => {
      if (!fresh) return;
      // MD 파일 내용으로 latestBaseSkills.prompt 보강 (GitHub MD 파일이 소스 오브 트루스)
      await enrichBaseSkillsFromMd(latestBaseSkills);
      const effective = getEffectiveBaseSkills();
      if (!isLoggedIn()) {
        // 비로그인: 최신 MD 기반 기본 스킬 표시
        state.skills = effective.length ? effective : fresh;
        saveState(); renderSidebar();
      } else {
        // 세션 로그인 중: category만 조용히 동기화, 나머지 변경은 '업데이트 적용' 버튼으로
        let changed = false;
        state.skills.forEach(sk => {
          if (sk.authorId !== null) return;
          const base = effective.find(b => b.id === sk.id);
          if (!base) return;
          if (base && sk.category !== base.category) { sk.category = base.category; changed = true; }
          // 프록시 HTML 오염 자동 복구 (사용자가 직접 편집하지 않은 기본 스킬만)
          if (!sk._editedFromBase && sk.prompt &&
              (/^\s*<!DOCTYPE html/i.test(sk.prompt) || /^\s*<html/i.test(sk.prompt))) {
            sk.prompt = base.prompt;
            changed = true;
          }
        });
        // 기존 워크스페이스에 없는 새 기본 스킬 자동 추가
        const existingIds = new Set(state.skills.map(s => s.id));
        const newBase = effective.filter(s => !existingIds.has(s.id));
        if (newBase.length > 0) {
          state.skills.push(...newBase.map(s => ({ ...s })));
          changed = true;
        }
        if (changed) { saveState(); renderSidebar(); }
        checkBaseSkillUpdates(effective);
      }
      // fetch 완료 후 상세 패널이 열려있으면 버튼 가시성 재평가
      if (selectedSkillId && $("detailPanel").classList.contains("open")) {
        openDetail(selectedSkillId);
      }
    });

    updateAdminUI();

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
