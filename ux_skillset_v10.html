<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AX 스킬셋</title>
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#0f1218">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AX 스킬셋">
  <link rel="apple-touch-icon" href="icon.svg">
  <style>
    :root {
      --bg: #0f1218;
      --surface: #171b24;
      --surface2: #1e2430;
      --border: #2a3142;
      --text: #e8ecf4;
      --muted: #8b95a8;
      --accent: #5b8def;
      --accent2: #3d6fd4;
      --success: #3ecf8e;
      --warn: #f0b429;
      --radius: 10px;
      --shadow: 0 8px 32px rgba(0,0,0,.35);
      --font: "Pretendard Variable", Pretendard, -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    }
    html.theme-light {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --surface2: #f5f6f8;
      --border: #dde1e9;
      --text: #1a1d23;
      --muted: #6b7280;
      --accent: #3b6fd4;
      --accent2: #2a58b8;
      --shadow: 0 8px 32px rgba(0,0,0,.10);
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); }
    button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, textarea, select { font-family: inherit; color: var(--text); }
    select {
      background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
      padding: 10px; width: 100%; font-size: 13px; margin-bottom: 12px; cursor: pointer;
    }
    select:focus { outline: none; border-color: var(--accent); }

    /* ── GNB ── */
    .app-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--surface); flex-shrink: 0;
    }
    .app-header h1 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.02em; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .btn-sm {
      padding: 6px 12px; border-radius: 8px; font-size: 12px;
      background: var(--surface2); border: 1px solid var(--border);
    }
    .btn-sm:hover { border-color: var(--accent); color: var(--accent); }
    .btn-primary {
      padding: 6px 14px; border-radius: 8px; font-size: 12px;
      background: var(--accent); color: #fff; border: 1px solid var(--accent2);
    }
    .btn-primary:hover { filter: brightness(1.08); }

    /* ── Layout ── */
    .main { display: flex; flex: 1; min-height: 0; height: calc(100vh - 48px); }

    /* ── Sidebar ── */
    .sidebar {
      width: 300px; min-width: 260px; border-right: 1px solid var(--border);
      display: flex; flex-direction: column; background: var(--surface);
    }
    .tabs { display: flex; border-bottom: 1px solid var(--border); }
    .tabs button {
      flex: 1; padding: 10px 6px; font-size: 12px; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -1px;
    }
    .tabs button.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
    .search-wrap { padding: 10px 12px 6px; }
    .search-wrap input {
      width: 100%; padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); font-size: 13px;
    }
    .search-wrap input:focus { outline: none; border-color: var(--accent); }


    .sidebar-scroll { flex: 1; overflow-y: auto; padding: 8px 10px 80px; }

    /* ── Skill chips ── */
    .skill-chip {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px;
      border-radius: var(--radius); border: 1px solid var(--border);
      background: var(--surface2); margin-bottom: 8px; cursor: grab;
      transition: border-color .15s;
    }
    .skill-chip:hover { border-color: var(--muted); }
    .skill-chip.dragging { opacity: 0.4; }
    .skill-chip.drop-before { box-shadow: 0 -3px 0 var(--accent); }
    .skill-chip.drop-after  { box-shadow: 0  3px 0 var(--accent); }
    .skill-chip .star { flex-shrink: 0; padding: 2px; color: var(--muted); font-size: 14px; }
    .skill-chip .star.on { color: var(--warn); }
    .skill-meta { flex: 1; min-width: 0; }
    .skill-meta .slash { font-size: 11px; color: var(--accent); font-family: ui-monospace, monospace; }
    .skill-meta .title { font-size: 13px; font-weight: 600; margin-top: 2px; }
    .skill-meta .desc { font-size: 11px; color: var(--muted); margin-top: 4px; line-height: 1.35; }
    .skill-foot {
      display: flex; align-items: center; gap: 5px; margin-top: 6px; flex-wrap: wrap;
    }
    .author-tag {
      font-size: 10px; color: var(--muted); background: var(--bg);
      border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px;
    }
    .usage-tag {
      font-size: 10px; color: var(--accent); background: rgba(91,141,239,.12);
      border-radius: 999px; padding: 1px 7px;
    }

    /* ── Category headers ── */
    .group-header {
      display: flex; align-items: center; margin: 12px 0 3px; gap: 4px;
      cursor: pointer; user-select: none;
    }
    .group-header:hover .group-name { color: var(--text); }
    .group-toggle {
      flex-shrink: 0;
      color: var(--muted); font-size: 8px;
    }
    .group-name {
      flex: 1;
      color: var(--muted); font-size: 10px; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
    }
    .group-count {
      background: var(--border); border-radius: 999px;
      padding: 1px 6px; font-size: 10px; font-weight: 400;
    }

    /* ── Main content ── */
    .content {
      flex: 1; display: flex; flex-direction: column; min-width: 0;
      padding: 14px; overflow-y: auto; padding-bottom: 120px;
    }
    .toolbar { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; align-items: center; }
    .toolbar .role { font-size: 12px; color: var(--muted); margin-left: auto; }
    .projects-grid { display: flex; flex-direction: column; gap: 14px; }

    /* ── Project cards ── */
    .project-card {
      border: 1px solid var(--border); border-radius: 12px; background: var(--surface2);
      overflow: hidden;
    }
    .project-head {
      display: flex; align-items: center; gap: 8px; padding: 10px 12px;
      background: var(--surface); border-bottom: 1px solid var(--border);
    }
    .project-head h2 { margin: 0; font-size: 14px; flex: 1; }
    .project-head .mini { font-size: 11px; color: var(--muted); }
    .phase-section {
      margin: 8px 10px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden;
    }
    .drop-zone {
      padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 6px;
      background: transparent;
      margin: 0 10px 10px; border-radius: 10px; border: 1px solid var(--border);
    }
    .drop-zone.drag-over { outline: 2px dashed var(--accent); outline-offset: -2px; border-radius: 10px; }
    .drop-label { font-size: 10px; color: var(--muted); }
    .drop-pills { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 6px; }
    .drop-hint { color: var(--muted); opacity: .4; font-size: 10px; padding: 4px 2px; }
    .instance-pill {
      display: flex; align-items: flex-start; gap: 8px; padding: 10px 10px;
      border-radius: 8px; border: 1px solid var(--border);
      background: var(--surface); cursor: pointer;
      box-sizing: border-box; transition: border-color .15s;
    }
    .instance-pill:hover { border-color: var(--accent); }
    .instance-pill .rm { color: var(--muted); padding: 1px 0 0 2px; cursor: pointer; font-size: 13px; flex-shrink: 0; }
    .instance-pill .rm:hover { color: #f87171; }

    /* ── Bottom detail panel ── */
    .detail-backdrop {
      position: fixed; top: 0; left: 300px; right: 0; bottom: 0; background: rgba(0,0,0,.45);
      opacity: 0; pointer-events: none; transition: opacity .25s; z-index: 40;
    }
    .detail-backdrop.open { opacity: 1; pointer-events: auto; }
    .detail-panel {
      position: fixed; left: 300px; right: 0; bottom: 0; height: 100dvh;
      background: var(--surface); border-top: 1px solid var(--border);
      border-radius: 16px 16px 0 0; box-shadow: var(--shadow);
      transform: translateY(105%); transition: transform .28s cubic-bezier(.2,.8,.2,1);
      z-index: 50; display: flex; flex-direction: column;
    }
    .detail-panel.open { transform: translateY(0); }
    .detail-handle {
      width: 40px; height: 4px; background: var(--border); border-radius: 2px;
      margin: 10px auto 6px; flex-shrink: 0;
    }
    .detail-head {
      padding: 0 18px 12px; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-start; gap: 12px; flex-shrink: 0;
    }
    .detail-head h3 { margin: 0; font-size: 16px; flex: 1; }
    .detail-body { flex: 1; overflow-y: auto; padding: 14px 18px 20px; display: flex; flex-direction: column; min-height: 0; }
    .detail-body .prompt-area { flex: 1; resize: none; }
    .detail-actions { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; flex-shrink: 0; align-items: center; }
    .copy-btn {
      padding: 8px 14px; border-radius: 8px; font-size: 13px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      color: #fff; font-weight: 600;
    }
    .copy-btn:hover { filter: brightness(1.06); }
    #llmTypeSelect { width: auto; margin: 0; padding: 6px 10px; font-size: 12px; flex-shrink: 0; }
    textarea.prompt-area {
      width: 100%; min-height: 160px; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); font-size: 13px; line-height: 1.5; resize: vertical;
    }
    .prompt-rendered {
      width: 100%; min-height: 160px; padding: 12px; border-radius: 8px;
      border: 1px solid var(--border); background: var(--bg); font-size: 13px; line-height: 1.6;
      overflow-y: auto; user-select: text; box-sizing: border-box; word-break: break-word;
    }
    .prompt-rendered h1,.prompt-rendered h2,.prompt-rendered h3 { font-weight:700; margin:.8em 0 .3em; }
    .prompt-rendered h1 { font-size:15px; border-bottom:1px solid var(--border); padding-bottom:4px; }
    .prompt-rendered h2 { font-size:14px; }
    .prompt-rendered h3 { font-size:13px; }
    .prompt-rendered hr { border:none; border-top:1px solid var(--border); margin:.8em 0; }
    .prompt-rendered strong { font-weight:700; }
    .prompt-rendered em { font-style:italic; }
    .prompt-rendered code { background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:ui-monospace,monospace; font-size:12px; }
    .prompt-rendered pre { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; overflow-x:auto; margin:.5em 0; }
    .prompt-rendered pre code { background:none; border:none; padding:0; font-size:12px; }
    .prompt-rendered ul,.prompt-rendered ol { padding-left:1.4em; margin:.3em 0; }
    .prompt-rendered li { margin:.1em 0; }
    .prompt-rendered p { margin:.4em 0; }
    .prompt-rendered .sep { color:var(--accent); font-weight:700; font-size:12px; letter-spacing:.03em; margin:.8em 0 .4em; display:block; }
    .prompt-rendered table { border-collapse:collapse; font-size:12px; width:100%; margin:.5em 0; }
    .prompt-rendered th,.prompt-rendered td { border:1px solid var(--border); padding:4px 8px; text-align:left; }
    .prompt-rendered th { background:var(--bg2); font-weight:600; }
    /* 저장 모달 탭 */
    .tab-edit-btn { font-size:11px; font-weight:600; padding:4px 10px; border-radius:6px; border:1px solid var(--border); background:transparent; color:var(--muted); cursor:pointer; transition:background .15s,color .15s; }
    .tab-edit-btn.active { background:var(--accent); color:#fff; border-color:var(--accent); }
    /* 뷰어 탭 */
    .view-tab-bar { display:flex; gap:2px; padding:8px 10px 0; background:var(--surface); border-bottom:1px solid var(--border); flex-shrink:0; }
    .view-tab-btn { font-size:11px; font-weight:600; padding:5px 12px 6px; border-radius:6px 6px 0 0; border:1px solid transparent; cursor:pointer; background:transparent; color:var(--muted); transition:color .15s; }
    .view-tab-btn.active { background:var(--bg); border-color:var(--border); border-bottom-color:var(--bg); color:var(--fg); margin-bottom:-1px; }
    /* 산출물 뷰어 Markdown 렌더 */
    .md-render { padding:16px 18px; font-size:13px; line-height:1.7; color:var(--fg); word-break:break-word; }
    .md-render h1 { font-size:18px; font-weight:700; margin:16px 0 8px; border-bottom:1px solid var(--border); padding-bottom:4px; }
    .md-render h2 { font-size:15px; font-weight:700; margin:14px 0 6px; border-bottom:1px solid var(--border); padding-bottom:3px; }
    .md-render h3 { font-size:13px; font-weight:700; margin:12px 0 5px; }
    .md-render hr { border:none; border-top:1px solid var(--border); margin:12px 0; }
    .md-render strong { font-weight:700; }
    .md-render em { font-style:italic; }
    .md-render code { background:var(--bg2); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:ui-monospace,monospace; font-size:12px; }
    .md-render pre:not(.mermaid) { background:var(--bg2); border:1px solid var(--border); border-radius:6px; padding:10px 12px; overflow-x:auto; margin:.5em 0; }
    .md-render pre:not(.mermaid) code { background:none; border:none; padding:0; }
    .md-render li { margin:.15em 0 .15em 18px; }
    .md-render table { border-collapse:collapse; font-size:12px; width:100%; margin:.6em 0; }
    .md-render th,.md-render td { border:1px solid var(--border); padding:5px 9px; text-align:left; }
    .md-render th { background:var(--bg2); font-weight:600; }
    /* Mermaid 다이어그램 렌더 */
    .mermaid-wrap { margin:14px 0; text-align:center; overflow-x:auto; }
    .mermaid-wrap .mermaid svg { max-width:100%; }
    .mermaid-wrap .mermaid { display:inline-block; min-width:100px; }

    /* ── Toast ── */
    .toast {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface2); border: 1px solid var(--border); padding: 10px 18px;
      border-radius: 999px; font-size: 13px; z-index: 100; opacity: 0; transition: .25s;
      white-space: nowrap; max-width: 90vw; overflow: hidden; text-overflow: ellipsis;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

    /* ── Modal ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 80;
      display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: 100%; max-width: 400px; background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px; box-shadow: var(--shadow);
    }
    .modal h4 { margin: 0 0 12px; font-size: 15px; }
    .modal label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    .modal input[type="text"],
    .modal input[type="password"] {
      width: 100%; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
      background: var(--bg); margin-bottom: 12px;
    }
    .modal input:focus { outline: none; border-color: var(--accent); }
    .modal .row { display: flex; gap: 8px; justify-content: flex-end; margin-top: 8px; }

    /* ── Manage modal ── */
    .manage-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 0; border-bottom: 1px solid var(--border); gap: 12px;
    }
    .manage-row:last-child { border-bottom: none; }
    .manage-label { font-size: 13px; }
    .manage-hint { font-size: 11px; color: var(--muted); margin-top: 2px; }
    .empty-state { color: var(--muted); font-size: 13px; text-align: center; padding: 40px 20px; }

    /* ── Phase deliverables ── */
    .phase-slots {
      padding: 10px; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px;
    }
    /* Phase 컬럼 = 통합 카드 */
    .phase-group {
      display: flex; flex-direction: column;
      background: var(--surface); border-radius: 10px;
      border: 1px solid var(--border); overflow: hidden;
    }
    /* 클릭 가능한 스킬 헤더 */
    .phase-group-head {
      padding: 10px 12px 9px; cursor: pointer;
      border-bottom: 1px solid var(--border);
      transition: background .15s;
    }
    .phase-group-head:hover { background: rgba(255,255,255,.04); }
    .phase-group-head .slash { font-size: 10px; font-weight: 700; color: var(--accent); letter-spacing: .05em; margin-bottom: 3px; }
    .phase-group-head .title { font-size: 12px; font-weight: 600; line-height: 1.3; }
    /* 슬롯 영역 */
    .phase-group-slots { padding: 6px; display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
    .phase-slot {
      border-radius: 6px; border: 1px dashed rgba(255,255,255,.1);
      padding: 7px 8px; cursor: pointer; min-width: 0; position: relative;
      transition: background .15s, border-color .15s;
    }
    .phase-slot:hover { background: rgba(255,255,255,.05); border-color: var(--accent); }
    .phase-slot.filled { border-style: solid; border-color: var(--accent); background: rgba(91,141,239,.08); }
    .phase-slot.filled:hover { border-color: var(--accent); background: rgba(91,141,239,.14); }
    .phase-slot .ps-label { font-size: 9px; font-weight: 700; letter-spacing: .05em; color: var(--muted); margin-bottom: 2px; }
    .phase-slot .ps-name { font-size: 11px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .phase-slot.empty .ps-name { color: var(--muted); font-weight: 400; font-size: 10px; }
    .phase-slot .ps-date { font-size: 9px; color: var(--muted); margin-top: 1px; }
    .phase-slot .ps-del { position: absolute; top: 4px; right: 5px; font-size: 12px; color: var(--muted); cursor: pointer; padding: 1px 3px; border-radius: 3px; line-height: 1; }
    .phase-slot .ps-del:hover { color: #f87171; background: rgba(248,113,113,.1); }
    .phase-slot.qa-slot .ps-label { color: #34d399; }
    .phase-slot.slot-guided { border-style: solid; border-color: var(--accent); background: rgba(91,141,239,.10); box-shadow: 0 0 0 2px rgba(91,141,239,.18); animation: slot-pulse 1.8s ease-in-out infinite; }
    .phase-slot.slot-dimmed { opacity: .28; pointer-events: none; }
    @keyframes slot-pulse { 0%,100%{box-shadow:0 0 0 2px rgba(91,141,239,.18)} 50%{box-shadow:0 0 0 4px rgba(91,141,239,.32)} }
    .qa-fixed-row { padding: 10px 12px; cursor: pointer; border-top: 1px solid var(--border); display: flex; align-items: center; gap: 8px; transition: background .15s; }
    .qa-fixed-row:hover { background: rgba(255,255,255,.04); }
    html.theme-light .qa-fixed-row:hover { background: rgba(0,0,0,.03); }
    .qa-fixed-row .slash { font-size: 10px; font-weight: 700; color: #34d399; letter-spacing: .05em; }
    .qa-fixed-row .title { font-size: 12px; font-weight: 600; line-height: 1.3; }
    /* 변경 이력 메모장 */
    .changelog-area {
      padding: 8px 10px 10px; border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 5px;
    }
    .changelog-area label {
      font-size: 10px; color: var(--muted);
    }
    .changelog-area textarea {
      width: 100%; box-sizing: border-box; resize: none; min-height: 70px; max-height: 200px;
      background: transparent; border: 1px solid transparent;
      border-radius: 6px; color: var(--fg); font-size: 11px;
      padding: 5px 7px; font-family: inherit; line-height: 1.6;
      transition: border-color .15s, background .15s; overflow-y: hidden;
    }
    .changelog-area textarea:hover { border-color: var(--border); }
    .changelog-area textarea:focus { border-color: var(--accent); background: var(--surface2); outline: none; overflow-y: auto; }
    /* 산출물 보기 모달 */
    .modal.modal-wide { max-width: 880px; height: 80vh; display: flex; flex-direction: column; padding-bottom: 14px; }
    .modal.modal-wide .modal-body { flex: 1; overflow: auto; min-height: 0; border-radius: 8px; border: 1px solid var(--border); }
    .modal.modal-wide iframe { width: 100%; height: 100%; border: none; background: #fff; }
    .modal.modal-wide pre { margin: 0; padding: 14px; white-space: pre-wrap; word-break: break-all; font-size: 12px; line-height: 1.6; }
  </style>
</head>
<body>
  <header class="app-header">
    <h1>AX 스킬셋</h1>
    <div class="header-actions">
      <button type="button" class="btn-sm" id="btnRefreshSkills" style="display:none" title="skills/index.json 에서 기본 스킬 새로고침">↻ 스킬 업데이트</button>
      <button type="button" class="btn-sm" id="btnManage">관리</button>
      <button type="button" class="btn-sm" id="btnLogin">로그인</button>
      <button type="button" class="btn-primary" id="btnNewProject">+ 프로젝트</button>
    </div>
  </header>

  <div class="main">
    <aside class="sidebar">
      <div class="tabs" id="sidebarTabs">
        <button type="button" data-tab="skills" class="active">스킬</button>
        <button type="button" data-tab="favorites">즐겨찾기</button>
        <button type="button" data-tab="projects">프로젝트</button>
      </div>
      <div class="search-wrap">
        <input type="search" id="sidebarSearch" placeholder="검색…" autocomplete="off" />
      </div>
      <div class="sidebar-scroll" id="sidebarList"></div>
    </aside>

    <section class="content">
      <div class="toolbar">

    async function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        try { await navigator.clipboard.writeText(text); return true; } catch {}
      }
      // execCommand fallback (file://, HTTP, older browsers)
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.cssText = "position:fixed;top:0;left:0;opacity:0;pointer-events:none";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      let ok = false;

      document.body.removeChild(ta);
      return ok;

    const DEFAULT_SKILLS = [
      { id: "s0", name: "피그마 초안 자동 생성", slash: "/figma-draft", desc: "CaMP 설계킷 기반 화면 초안", authorId: null, authorName: "", usage: 0,

      { id: "s1", name: "스펙 분석 · 문의 목록", slash: "/spec-analysis", desc: "스펙 파악 + 애매한 항목 추출", authorId: null, authorName: "", usage: 0,
        prompt: `다음 제품/기능 스펙을 읽고 정리하세요.\n\n1) 핵심 사용자 시나리오 요약\n2) 명확히 정의된 요구사항 목록\n3) 애매하거나 누락 가능성이 있는 항목 → PM/개발에 질문할 문의 목록(우선순위 포함)\n4) UX 리스크(인지부하, 오류 가능성 등)\n\n스펙:\n` },
      { id: "s2", name: "벤치마킹 · 인사이트", slash: "/benchmarking", desc: "유사 서비스 사례 수집", authorId: null, authorName: "", usage: 0,
        prompt: `우리가 만들려는 서비스/기능과 유사한 글로벌·국내 사례를 벤치마킹하세요.\n\n- 서비스명, URL(알면), 관련 화면\n- 잘한 점 / 아쉬운 점\n- 우리 제품에 가져올 인사이트 3가지\n\n대상:\n` },

        prompt: `현재(As-is)와 개선 후(To-be)를 비교하는 표와 한 페이지 요약 슬라이드용 불릿을 만드세요.\n\n표 열: 영역 | As-is | To-be | 기대효과 | 이해관계자 메시지\n\n맥락:\n` },
      { id: "s4", name: "플로우차트 · 프로세스 맵", slash: "/flowchart", desc: "Mermaid 다이어그램 자동 생성", authorId: null, authorName: "", usage: 0,
        prompt: `아래 프로세스를 Mermaid flowchart 문법으로 표현하세요. 분기·예외·되돌아가기를 포함하고, 코드블록으로만 출력하세요.\n\n프로세스 설명:\n` },

    function wsKey(workspace) {
      return workspace ? `${STORAGE_KEY}_ws_${workspace}` : STORAGE_KEY;

    async function listWorkspaces() {
      const fsWs = await listWorkspacesFromFs();
      if (fsWs.length) return fsWs;
      const prefix = `${STORAGE_KEY}_ws_`;
      const list = [];
      for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(prefix)) list.push(k.slice(prefix.length));
      }
      return list;
    }
    function normalizeData(d) {
      if (!d.skills || !d.skills.length) d.skills = DEFAULT_SKILLS.map(s => ({ ...s }));
      if (!d.projects) d.projects = [{ id: uid(), name: "프로젝트 1", instances: [] }];

      if (!d.session) d.session = { mode: "guest", displayName: "", admin: false };
      if (typeof d.caseCount !== "number") d.caseCount = 0;
      if (!d.llmType) d.llmType = 'other';
      if (!d.registeredSkills || typeof d.registeredSkills !== 'object') d.registeredSkills = {};
      d.skills.forEach(s => {
        if (typeof s.usage !== "number") s.usage = 0;
        if (!("authorName" in s)) s.authorName = "";
      });
      return d;
    }
    function parseStored(key) {

    async function _fsDb(mode, fn) {

        req.onupgradeneeded = e => e.target.result.createObjectStore("h");
        req.onsuccess = e => { const s = e.target.result.transaction("h", mode).objectStore("h"); fn(s, res); };
        req.onerror = () => rej(req.error);
      });
    }
    async function getFsHandle() {
      try { return await _fsDb("readonly", (s, res) => { const r = s.get("root"); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); }); }
      catch { return null; }
    }
    async function setFsHandle(h) {
      try { await _fsDb("readwrite", (s, res) => { const r = s.put(h, "root"); r.onsuccess = () => res(); r.onerror = () => res(); }); }
      catch {}
    }
    async function initFsHandle() {
      if (!FS_SUPPORTED) return;
      const h = await getFsHandle();
      if (!h) return;
      try {
        const perm = await h.queryPermission({ mode: "readwrite" });
        if (perm === "granted") { rootHandle = h; sessionHandle = null; }
      } catch {}
    }
    async function connectFolder() {
      if (!FS_SUPPORTED) { toast("이 브라우저는 파일 접근 API를 지원하지 않습니다 (Chrome/Edge 권장)"); return; }
      try {
        const h = await window.showDirectoryPicker({ mode: "readwrite", startIn: "desktop" });
        rootHandle = h; sessionHandle = null;
        await setFsHandle(h);
        // 연결 직후 현재 세션 상태를 즉시 파일로 저장
        const ws = state.session && state.session.workspace;
        if (ws) {
          await saveToFs(ws, state);
          toast(`✓ skills/session/${ws}.json 저장됨 — 이후 자동 동기화`);
        } else {
          toast("폴더 연결됨 ✓ — 로그인하면 세션별로 자동 저장됩니다");
        }
      } catch (e) { if (e.name !== "AbortError") toast("폴더 연결 실패"); }
    }
    // rootHandle = skills/ 폴더, sessionHandle = skills/session/ (자동 생성)
    // 파일 구조: skills/session/{workspace}.json (평탄 파일, 폴더 없음)
    async function getSessionHandle() {
      if (sessionHandle) return sessionHandle;
      if (!rootHandle) return null;
      try {
        sessionHandle = await rootHandle.getDirectoryHandle("session", { create: true });
        return sessionHandle;
      } catch { return null; }
    }
    async function saveToFs(workspace, data) {
      const sh = await getSessionHandle();
      if (!sh) return;
      try {
        const fh = await sh.getFileHandle(`${workspace}.json`, { create: true });
        const w  = await fh.createWritable();
        await w.write(JSON.stringify(data, null, 2)); await w.close();
      } catch {}
    }
    async function loadFromFs(workspace) {
      const sh = await getSessionHandle();
      if (!sh) return null;
      try {
        const fh = await sh.getFileHandle(`${workspace}.json`);
        return JSON.parse(await (await fh.getFile()).text());
      } catch { return null; }
    }
    async function deleteFromFs(workspace) {
      const sh = await getSessionHandle();
      if (!sh) return;
      try { await sh.removeEntry(`${workspace}.json`); } catch {}
    }
    async function listWorkspacesFromFs() {
      const sh = await getSessionHandle();
      if (!sh) return [];
      try {
        const list = [];
        for await (const [name, h] of sh.entries()) {
          if (h.kind === "file" && name.endsWith(".json") && name !== "index.json")
            list.push(name.slice(0, -5));
        }
        return list;
      } catch { return []; }
    }

    // 사용자 생성 스킬 MD 파일 삭제 (session/{slug}.md)
    async function deleteSkillMdFromFs(sk) {
      if (!sk || !sk.slash) return;
      const sh = await getSessionHandle();
      if (!sh) return;
      const slug = sk.slash.slice(1);
      try { await sh.removeEntry(`${slug}.md`); } catch {}
    }

    // 사용자 생성 스킬을 session/{slug}.md 로 저장 (run.command 자동 설치 연동)
    async function saveSkillMdToFs(sk) {
      if (!sk || !sk.slash) return;
      const sh = await getSessionHandle();
      if (!sh) return;
      const slug = sk.slash.slice(1); // /my-skill → my-skill
      const content = [
        `---`,
        `id: ${sk.id}`,
        `name: ${sk.name}`,
        `slash: ${sk.slash}`,
        `desc: ${sk.desc || ""}`,
        `guide: ${sk.guide || ""}`,
        `authorName: ${sk.authorName || ""}`,
        `---`,
        ``,
        sk.prompt || "",
      ].join("\n");
      try {
        const fh = await sh.getFileHandle(`${slug}.md`, { create: true });
        const w  = await fh.createWritable();
        await w.write(content); await w.close();
      } catch {}
    }

    // 관리자가 기본 스킬 편집 시 skills/{id}-{slash}.md 파일에 직접 저장
    async function saveBaseSkillMdToFs(sk) {
      if (!sk || !sk.slash || !rootHandle) return;
      const filename = `${sk.id}-${sk.slash.slice(1)}.md`;
      const content = [
        `---`,
        `id: ${sk.id}`,
        `name: ${sk.name}`,
        `slash: ${sk.slash}`,
        `desc: ${sk.desc || ""}`,
        `category: ${sk.category || ""}`,
        `---`,
        ``,
        sk.prompt || "",
      ].join("\n");
      try {
        const fh = await rootHandle.getFileHandle(filename, { create: true });
        const w  = await fh.createWritable();
        await w.write(content); await w.close();
        toast("💾 기본 스킬 MD 저장됨 — git push 후 다른 사용자에게 반영됩니다");
      } catch {}
    }

    function loadState() {
      const base = parseStored(STORAGE_KEY) || defaultState();
      // 마지막 워크스페이스 세션이 있으면 해당 워크스페이스 데이터 복원
      if (base.session && base.session.workspace) {
        const ws = parseStored(wsKey(base.session.workspace));
        if (ws) return ws;
        base.session.workspace = null; // 워크스페이스 데이터 없으면 초기화
      }
      return base;
    }
    loadState.fallback = defaultState;

    function saveState() {
      state.collapsedGroups = [...collapsedGroups];
      state.sidebarTab = sidebarTab;
      const ws = state.session && state.session.workspace;
      // localStorage (항상 저장 — fallback)
      localStorage.setItem(wsKey(ws), JSON.stringify(state));
      if (ws) {
        let base = {};
        try { base = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; } catch {}
        base.session = state.session;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(base));
      }
      // File system (연결된 경우 skills/session/{ws}.json 에도 저장)
      if (ws && rootHandle) saveToFs(ws, state).catch(() => {});
    }

    let state = loadState();
    let sidebarTab = state.sidebarTab || "skills";
    let selectedSkillId = null;
    let selectedProjectId = null;
    let editingSkillId = null;
    let pendingAction = null; // { type:'deliverable'|'qa', projectId, phaseKey? }

    // 이전 Phase 슬롯 내용을 복사 프롬프트에 자동 주입
    const PHASE_INJECT = {
      s1:  { output: null     },
      p2:  { output: 'phase1' },
      p3:  { output: 'phase2' },
      qa:  { output: '__auto' },
    };
    function buildInjection(projectId, skillId) {
      if (!projectId) return "";
      const p = state.projects.find(x => x.id === projectId);
      if (!p) return "";
      const cfg = PHASE_INJECT[skillId];
      if (!cfg) return "";
      let outputKey = cfg.output;
      if (outputKey === '__auto') {
        for (const k of ['phase3', 'phase2', 'phase1']) {
          if (p.deliverables?.[k]?.content) { outputKey = k; break; }
        }
        if (outputKey === '__auto') outputKey = null;
      }
      const outputContent = outputKey ? p.deliverables?.[outputKey]?.content : null;
      const logContent    = p.changeLog?.trim() || null;
      if (!outputContent && !logContent) return "";
      const phaseLabel = { phase1: 'Phase 1 (/spec)', phase2: 'Phase 2 (/schema)', phase3: 'Phase 3 (/build)' };
      let out = "\n\n---\n";
      if (outputContent) out += `\n입력 자료 (${phaseLabel[outputKey] || outputKey} 산출물 — 자동 포함):\n\n${outputContent}`;
      if (logContent)    out += `\n\n---\n\n변경 결정 사항:\n\n${logContent}`;
      return out;
    }

    let dragSkillId = null;
    const collapsedGroups = new Set(state.collapsedGroups || []);

    const $ = (id) => document.getElementById(id);

    /** 워크스페이스 전환 후 UI 상태 복원 */
    function applyWorkspaceState() {
      collapsedGroups.clear();
      (state.collapsedGroups || []).forEach(id => collapsedGroups.add(id));
      sidebarTab = state.sidebarTab || "skills";
      document.querySelectorAll("#sidebarTabs button").forEach(b => {
        b.classList.toggle("active", b.dataset.tab === sidebarTab);
      });
    }

    /** 로그인 여부 — 이름이 있는 세션 = 로그인 상태 */
    function isLoggedIn() { return state.session.mode === "user"; }
    function isAdmin() { return !!state.session.admin; }

    function roleLabelText() {
      const ws = state.session.workspace;
      const wsLabel = ws ? ` [${ws}]` : "";
      if (state.session.admin) return `${state.session.displayName || "관리자"}${wsLabel} (관리자)`;
      if (state.session.mode === "user") return `${state.session.displayName || "사용자"}${wsLabel}`;
      return "비로그인 · 복사만 가능";
    }

    function normalizeSlash(s) {
      s = (s || "").trim();
      if (!s.startsWith("/")) s = "/" + s;
      return s.replace(/\s+/g, "-").toLowerCase();
    }

    function escapeHtml(t) {
      const d = document.createElement("div");
      d.textContent = t || "";
      return d.innerHTML;
    }

    const HIDDEN_SKILL_CATS = new Set(["Analysis", "Planning"]);

    function filteredSkills() {
      const q = ($("sidebarSearch").value || "").trim().toLowerCase();
      let list = [...state.skills].filter(s => !HIDDEN_SKILL_CATS.has(s.category));
      if (sidebarTab === "favorites") {
        list = list.filter(s => state.favorites.includes(s.id));
      }
      if (q) {
        list = list.filter(s =>
          s.name.toLowerCase().includes(q) ||
          (s.slash || "").toLowerCase().includes(q) ||
          (s.desc || "").toLowerCase().includes(q)
        );
      }
      return list;
    }

    function appendSkillChip(container, skill) {
      const chip = document.createElement("div");
      chip.className = "skill-chip";
      chip.draggable = true;
      chip.dataset.skillId = skill.id;
      const fav = state.favorites.includes(skill.id);

      // footer: author + usage count
      let footHtml = "";
      if (skill.authorName) footHtml += `<span class="author-tag">${escapeHtml(skill.authorName)}</span>`;
      if (typeof skill.usage === "number" && skill.usage > 0) {
        footHtml += `<span class="usage-tag">${skill.usage}회 사용</span>`;
      }

      chip.innerHTML = `
        <button type="button" class="star ${fav ? "on" : ""}" data-star title="즐겨찾기">★</button>
        <div class="skill-meta">
          <div class="slash">${escapeHtml(skill.slash)}</div>
          <div class="title">${escapeHtml(skill.name)}</div>
          <div class="desc">${escapeHtml(skill.desc || "")}</div>
          ${footHtml ? `<div class="skill-foot">${footHtml}</div>` : ""}
        </div>`;

      chip.querySelector(".star").addEventListener("click", (e) => {
        e.stopPropagation();
        toggleFav(skill.id);
      });
      chip.addEventListener("click", (e) => {
        if (e.target.closest(".star")) return;
        openDetail(skill.id);
      });
      chip.addEventListener("dragstart", (e) => {
        dragSkillId = skill.id;
        chip.classList.add("dragging");
        e.dataTransfer.setData("text/skill-id", skill.id);
        e.dataTransfer.effectAllowed = "all";
      });
      chip.addEventListener("dragend", () => {
        chip.classList.remove("dragging");
        document.querySelectorAll(".skill-chip").forEach(c =>
          c.classList.remove("drop-before", "drop-after")
        );
        dragSkillId = null;
      });
      chip.addEventListener("dragover", (e) => {
        if (!dragSkillId || dragSkillId === skill.id) return;
        const src = state.skills.find(s => s.id === dragSkillId);
        if (!src || src.category !== skill.category) return;
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = "move";
        const mid = chip.getBoundingClientRect().top + chip.getBoundingClientRect().height / 2;
        chip.classList.remove("drop-before", "drop-after");
        chip.classList.add(e.clientY < mid ? "drop-before" : "drop-after");
      });
      chip.addEventListener("dragleave", () => {
        chip.classList.remove("drop-before", "drop-after");
      });
      chip.addEventListener("drop", (e) => {
        chip.classList.remove("drop-before", "drop-after");
        if (!dragSkillId || dragSkillId === skill.id) return;
        const src = state.skills.find(s => s.id === dragSkillId);
        if (!src || src.category !== skill.category) return;
        e.preventDefault();
        e.stopPropagation();
        const isBefore = e.clientY < chip.getBoundingClientRect().top + chip.getBoundingClientRect().height / 2;
        const fromIdx = state.skills.findIndex(s => s.id === dragSkillId);
        const [moved] = state.skills.splice(fromIdx, 1);
        const toIdx = state.skills.findIndex(s => s.id === skill.id);
        state.skills.splice(isBefore ? toIdx : toIdx + 1, 0, moved);
        saveState();
        renderSidebar();
      });
      container.appendChild(chip);
    }

    function renderSidebar() {
      const el = $("sidebarList");
      el.innerHTML = "";

      if (sidebarTab === "projects") {
        state.projects.forEach(p => {
          const row = document.createElement("button");
          row.type = "button";
          row.className = "skill-chip";
          row.style.cursor = "pointer";
          row.innerHTML = `<div class="skill-meta"><div class="title">${escapeHtml(p.name)}</div><div class="desc">스킬 ${p.instances.length}개 · 클릭 시 스크롤</div></div>`;
          row.addEventListener("click", () => {
            const card = document.querySelector(`[data-project-id="${CSS.escape(p.id)}"]`);
            card?.scrollIntoView({ behavior: "smooth", block: "start" });
          });
          el.appendChild(row);
        });
        if (!state.projects.length) el.innerHTML = `<div class="empty-state">프로젝트가 없습니다.</div>`;
        return;
      }

      const skills = filteredSkills().filter(s => s.id !== 'qa');
      const q = ($("sidebarSearch").value || "").trim();

      if (sidebarTab === "skills" && !q) {
        // ── Phase 1·2·3 통합 아코디언 ──
        const PHASE_CATS = ["Phase 1", "Phase 2", "Phase 3"];
        const PHASE_CAT_SET = new Set(["Phase 1", "Phase 2", "Phase 3", "Analysis", "Planning"]);
        const phaseSkills = PHASE_CATS.flatMap(ph => skills.filter(s => s.category === ph));
        if (phaseSkills.length) {
          const catKey = "__cat__phase";
          const hdr = document.createElement("div");
          hdr.className = "group-header";
          hdr.dataset.catKey = catKey;
          hdr.style.cursor = "pointer";
          const isCollapsed = collapsedGroups.has(catKey);
          hdr.innerHTML = `<span class="group-toggle">${isCollapsed ? "▶" : "▼"}</span><span class="group-name">Phase</span><span class="group-count">${phaseSkills.length}</span>`;
          hdr.addEventListener("click", () => {
            if (collapsedGroups.has(catKey)) collapsedGroups.delete(catKey);
            else collapsedGroups.add(catKey);
            renderSidebar();
          });
          el.appendChild(hdr);
          if (!isCollapsed) phaseSkills.forEach(sk => appendSkillChip(el, sk));
        }
        // ── 나머지 카테고리 (공통 등) ──
        const otherCatOrder = ["공통"];
        const otherCatSet = new Set(skills.filter(s => s.category && !PHASE_CAT_SET.has(s.category)).map(s => s.category));
        const otherCats = otherCatOrder.filter(c => otherCatSet.has(c)).concat([...otherCatSet].filter(c => !otherCatOrder.includes(c)));
        otherCats.forEach(cat => {
          const catSkills = skills.filter(s => s.category === cat);
          if (!catSkills.length) return;
          const catKey = `__cat__${cat}`;
          const hdr = document.createElement("div");
          hdr.className = "group-header";
          hdr.dataset.catKey = catKey;
          hdr.style.cursor = "pointer";
          const isCollapsed = collapsedGroups.has(catKey);
          hdr.innerHTML = `<span class="group-toggle">${isCollapsed ? "▶" : "▼"}</span><span class="group-name">${escapeHtml(cat)}</span><span class="group-count">${catSkills.length}</span>`;
          hdr.addEventListener("click", () => {
            if (collapsedGroups.has(catKey)) collapsedGroups.delete(catKey);
            else collapsedGroups.add(catKey);
            renderSidebar();
          });
          el.appendChild(hdr);
          if (!isCollapsed) catSkills.forEach(sk => appendSkillChip(el, sk));
        });
        // 카테고리 없는 스킬 (사용자 생성 스킬)
        const noCat = skills.filter(s => !s.category);
        if (noCat.length) {
          const catKey = "__cat__none";
          const hdr = document.createElement("div");
          hdr.className = "group-header";
          hdr.style.cursor = "pointer";
          const isCollapsed = collapsedGroups.has(catKey);
          hdr.innerHTML = `<span class="group-toggle">${isCollapsed ? "▶" : "▼"}</span><span class="group-name">내 스킬</span><span class="group-count">${noCat.length}</span>`;
          hdr.addEventListener("click", () => {
            if (collapsedGroups.has(catKey)) collapsedGroups.delete(catKey);
            else collapsedGroups.add(catKey);
            renderSidebar();
          });
          el.appendChild(hdr);
          if (!isCollapsed) noCat.forEach(sk => appendSkillChip(el, sk));
        }
        if (!skills.length) el.innerHTML = `<div class="empty-state">해당 없음</div>`;
      } else {
        if (!skills.length) {
          el.innerHTML = `<div class="empty-state">해당 없음</div>`;
        } else {
          skills.forEach(sk => appendSkillChip(el, sk));
        }
      }

      // 로그인 시에만 스킬 추가 버튼 노출
      if (sidebarTab === "skills" && isLoggedIn()) {
        const add = document.createElement("button");
        add.type = "button";
        add.className = "btn-primary";
        add.style.cssText = "width:100%;margin-top:12px";
        add.textContent = "+ 새 스킬 추가";
        add.addEventListener("click", () => openSkillModal(null));
        el.appendChild(add);
      }
    }

    function toggleFav(id) {
      const i = state.favorites.indexOf(id);
      if (i >= 0) state.favorites.splice(i, 1);
      else state.favorites.push(id);
      saveState();
      renderSidebar();
    }

    // ── Phase 산출물 관리 ──
    const PHASE_META = {
      phase1:    { label: '산출물', name: 'Markdown 스펙',   ext: 'md'   },
      phase1_qa: { label: '/qa',   name: 'QA 리포트',       ext: 'html' },
      phase2:    { label: '산출물', name: 'JSON Schema',  ext: 'json' },
      phase2_qa: { label: '/qa',   name: 'QA 리포트',   ext: 'html' },
      phase3:    { label: '산출물', name: 'HTML 프로토타입', ext: 'html' },
      phase3_qa: { label: '/qa',   name: 'QA 리포트',       ext: 'html' },
    };
    const PHASE_GROUPS = [
      { key: 'phase1', label: '/spec',   slots: ['phase1', 'phase1_qa'] },
      { key: 'phase2', label: '/schema', slots: ['phase2', 'phase2_qa'] },
      { key: 'phase3', label: '/build',  slots: ['phase3', 'phase3_qa'] },
    ];
    let _delivEditState = null;
    let _delivViewState = null;

    function openDelivEdit(projectId, phase) {
      const p = state.projects.find(x => x.id === projectId);
      if (!p) return;
      _delivEditState = { projectId, phase };
      $("delivEditTitle").textContent = `${PHASE_META[phase].label} 산출물 저장`;
      $("delivEditArea").value = p.deliverables?.[phase]?.content || "";
      const isP2 = phase === 'phase2';
      $("delivEditTabs").style.display = isP2 ? 'flex' : 'none';
      if (isP2) {
        $("delivEditReportArea").value = p.deliverables?.phase2?.report || "";
        $("delivEditArea").style.display = '';
        $("delivEditReportArea").style.display = 'none';
        $("tabEditJson").classList.add('active');
        $("tabEditReport").classList.remove('active');
      }
      $("modalDelivEdit").classList.add("open");
      setTimeout(() => $("delivEditArea").focus(), 80);
    }

    function openDelivView(projectId, phase) {
      const p = state.projects.find(x => x.id === projectId);
      if (!p) return;
      const deliv = p.deliverables?.[phase];
      if (!deliv) return;
      _delivViewState = { projectId, phase };
      const meta = PHASE_META[phase];
      $("delivViewTitle").textContent = `${meta.label} — ${meta.name}`;
      const body = $("delivViewBody");
      body.innerHTML = "";
      body.style.cssText = "";
      const _isHtml = /^\s*<!DOCTYPE html/i.test(deliv.content) || /^\s*<html/i.test(deliv.content);
      let _viewIframe = null;

      if (phase === 'phase2') {
        // 탭 뷰: JSON Schema | 설계 리포트
        body.style.cssText = "overflow:hidden;display:flex;flex-direction:column;";
        const tabBar = document.createElement("div");
        tabBar.className = "view-tab-bar";
        const tabJson = document.createElement("button");
        tabJson.type = "button"; tabJson.className = "view-tab-btn active"; tabJson.textContent = "JSON Schema";
        const tabReport = document.createElement("button");
        tabReport.type = "button"; tabReport.className = "view-tab-btn"; tabReport.textContent = "설계 리포트";
        if (!deliv.report) tabReport.style.opacity = ".45";
        tabBar.appendChild(tabJson); tabBar.appendChild(tabReport);
        body.appendChild(tabBar);

        const scroll = document.createElement("div");
        scroll.style.cssText = "flex:1;overflow:auto;min-height:0;";
        body.appendChild(scroll);

        // JSON 패널
        const jsonPanel = document.createElement("div");
        const pre = document.createElement("pre");
        try { pre.textContent = JSON.stringify(JSON.parse(deliv.content || ""), null, 2); }
        catch { pre.textContent = deliv.content || ""; }
        jsonPanel.appendChild(pre);

        // 리포트 패널
        const reportPanel = document.createElement("div");
        reportPanel.style.display = "none";
        if (deliv.report) {
          const rdiv = document.createElement("div");
          rdiv.className = "md-render";

        const sortedInstances = [...p.instances].sort((a, b) => {

          if (ai >= 0 && bi >= 0) return ai - bi;

        sortedInstances.forEach(inst => {

              slot.addEventListener("click", () => {

        const dropPills = document.createElement("div");
        dropPills.className = "drop-pills";
        zone.appendChild(dropLabel);
        zone.appendChild(dropPills);
        if (otherInsts.length === 0) {
          const hint = document.createElement("div");
          hint.className = "drop-hint";
          hint.textContent = "사이드바에서 스킬을 드래그해 추가하세요";
          dropPills.appendChild(hint);
        }
        otherInsts.forEach(inst => {
          const sk = state.skills.find(s => s.id === inst.skillId);
          if (!sk) return;
          const pill = document.createElement("div");
          pill.className = "instance-pill";
          pill.innerHTML = `<div class="skill-meta" style="flex:1;min-width:0">

          </div>`;
          pill.addEventListener("click", (e) => {
            if (e.target.closest(".rm")) return;
            openDetail(sk.id, p.id);
          });
          const rm = document.createElement("span");
          rm.className = "rm"; rm.textContent = "×"; rm.title = "프로젝트에서 제거";
          rm.addEventListener("click", (e) => {
            e.stopPropagation();
            p.instances = p.instances.filter(x => x.instanceId !== inst.instanceId);
            saveState(); renderProjects();

          pill.appendChild(rm);
          dropPills.appendChild(pill);
        });

        ["dragenter", "dragover"].forEach(ev =>
          zone.addEventListener(ev, (e) => { e.preventDefault(); zone.classList.add("drag-over"); })
        );
        zone.addEventListener("dragleave", (e) => {
          if (!zone.contains(e.relatedTarget)) zone.classList.remove("drag-over");
        });
        zone.addEventListener("drop", (e) => {
          e.preventDefault();
          zone.classList.remove("drag-over");
          const sid = e.dataTransfer.getData("text/skill-id") || dragSkillId;
          if (!sid) return;
          const proj = state.projects.find(x => x.id === p.id);
          if (!proj) return;
          proj.instances.push({ instanceId: uid(), skillId: sid });
          saveState(); renderProjects();
        });

        // 변경 이력 메모장
        const clArea = document.createElement("div");
        clArea.className = "changelog-area";
        const clLabel = document.createElement("label");
        clLabel.textContent = "변경 이력 (Phase 스킬 복사 시 자동 포함)";
        const clTa = document.createElement("textarea");
        clTa.placeholder = "QA 리뷰 후 변경 결정 사항을 여기에 누적 기록하세요.";

        const phaseSection = document.createElement("div");
